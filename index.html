<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infantiles Riestra</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#CAD2C5;--c2:#84A98C;--c3:#52796F;--c4:#354F52;--c5:#2F3E46;
  --bg:#F7F8F6;--card:#FFFFFF;--border:#E2E7E2;
  --text:#2A3530;--text-2:#6B7B72;--text-3:#9FACA3;
  --err-bg:#FBEAE9;--err-text:#9A3B34;--err-border:#E8C4C0;
  --r:8px;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;flex-direction:column;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ── LOGIN ──────────────────────────────── */
#loginOverlay{position:fixed;inset:0;background:var(--c5);display:flex;align-items:center;
  justify-content:center;z-index:9999;padding:24px}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:14px;padding:48px 40px 40px;
  box-shadow:0 30px 90px rgba(0,0,0,.35);text-align:center}
.login-logo{width:84px;height:84px;object-fit:contain;margin:0 auto 20px}
.login-title{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--c5);letter-spacing:-.3px;margin-bottom:6px}
.login-author{font-size:12.5px;color:var(--text-3);font-style:italic;margin-bottom:30px}
.login-label{display:block;font-size:11px;font-weight:600;color:var(--text-2);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;text-align:left}
.login-input-wrap{position:relative;margin-bottom:14px}
.login-input{width:100%;padding:12px 44px 12px 14px;background:var(--bg);
  border:1.5px solid var(--border);border-radius:7px;color:var(--c5);
  font-family:var(--sans);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.login-input:focus{border-color:var(--c3);box-shadow:0 0 0 3px rgba(82,121,111,.13)}
.login-input::placeholder{color:var(--text-3)}
.toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;
  border:none;color:var(--text-3);cursor:pointer;padding:4px;line-height:0}
.toggle-pass:hover{color:var(--text-2)}
.login-error{display:none;background:var(--err-bg);border:1px solid var(--err-border);
  border-radius:7px;padding:10px 14px;font-size:12.5px;color:var(--err-text);
  margin-bottom:14px;text-align:left}
.login-error.visible{display:block}
.login-btn{width:100%;padding:13px;background:var(--c4);color:#fff;border:none;border-radius:7px;
  font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.login-btn:hover{background:var(--c5)}
.login-btn:disabled{opacity:.55;cursor:not-allowed}
.login-spinner{display:none;width:17px;height:17px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}

/* ── HEADER ─────────────────────────────── */
.header{background:var(--c5);padding:18px 28px;flex-shrink:0;position:sticky;top:0;z-index:200}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:38px;height:38px;object-fit:contain;flex-shrink:0}
.brand-text-h{font-family:var(--serif);font-size:18px;font-weight:600;color:#fff;letter-spacing:-.2px;line-height:1.2}
.brand-text-s{font-size:11px;color:rgba(255,255,255,.4);font-style:italic;margin-top:1px}
.logout-btn{padding:7px 16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:6px;color:rgba(255,255,255,.65);font-family:var(--sans);font-size:12px;font-weight:500;
  cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.logout-btn:hover{background:rgba(255,255,255,.13);color:#fff}

/* ── TOP TABS ────────────────────────────── */
.tabs-nav{background:#fff;border-bottom:1.5px solid var(--border);position:sticky;top:74px;z-index:190}
.tabs-nav-inner{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:0 28px;
  overflow-x:auto;scrollbar-width:none}
.tabs-nav-inner::-webkit-scrollbar{display:none}
.top-tab{padding:15px 18px;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--text-3);
  background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s}
.top-tab:hover{color:var(--text)}
.top-tab.active{color:var(--c4);border-bottom-color:var(--c3)}

/* ── MAIN ────────────────────────────────── */
.main{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:36px 28px 64px}

/* ── HOME ────────────────────────────────── */
.home-hero{text-align:center;padding:36px 20px 44px;border-bottom:1px solid var(--border);margin-bottom:40px}
.home-hero img{width:96px;height:96px;object-fit:contain;margin:0 auto 18px}
.home-hero h1{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--c5);letter-spacing:-.5px}
.home-hero p{font-size:13.5px;color:var(--text-3);font-style:italic;margin-top:6px}
.logros-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;margin-bottom:48px}
.logro-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:26px 20px;text-align:center}
.logro-valor{font-family:var(--serif);font-size:36px;font-weight:700;color:var(--c4);letter-spacing:-1px}
.logro-label{font-size:12.5px;color:var(--text-2);margin-top:4px;font-weight:500}
.cats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);text-align:left;
  padding:22px;cursor:pointer;transition:border-color .15s,transform .12s;font-family:var(--sans);width:100%}
.cat-card:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
.cat-card:hover{border-color:var(--c2);transform:translateY(-2px)}
.cat-card-title{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--c5)}
.cat-card-meta{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.6}
.logro-skel .logro-valor,.logro-skel .logro-label{background:#EEF1EE;border-radius:4px;color:transparent}
.logro-skel .logro-valor{width:60%;margin:0 auto 8px}.logro-skel .logro-label{width:80%;margin:0 auto}
.home-note{font-size:12px;color:var(--text-3);margin:-34px 0 40px}
.section-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:16px}

/* ── CATEGORY VIEW ───────────────────────── */
.cat-header{margin-bottom:24px}
.cat-header h2{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--c5);letter-spacing:-.3px}

/* ── INDICADORES ─────────────────────────── */
.indicadores-wrap{margin-bottom:36px}
.indicadores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:24px}
.indicador-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.indicador-title{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--c5);margin-bottom:14px}
.indicador-chart-wrap{position:relative;height:200px;display:flex;align-items:center;justify-content:center}
.indicador-legend{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.legend-val{margin-left:auto;font-weight:600;color:var(--c5)}

/* ── CHIP NAVIGATION ─────────────────────── */
.chip-groups{display:flex;flex-direction:column;gap:18px;margin-bottom:28px}
.chip-group-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:20px;
  font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--c2);color:var(--text)}
.chip.active{background:var(--c4);border-color:var(--c4);color:#fff}
.chip-empty{font-size:12.5px;color:var(--text-3);font-style:italic}
.doc-row{margin-bottom:24px}
.doc-chip{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 14px}
.doc-tag{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:4px}
.doc-tag.pdf{background:#F3EFE6;color:#7A5C2E}
.doc-tag.xls{background:#EAF1EC;color:var(--c4)}
.chip.active .doc-tag{background:rgba(255,255,255,.18);color:#fff}
.doc-link{border-style:dashed;color:var(--c4)}
.viewer-wrap{margin-bottom:32px;padding:18px;background:#EEF1EE;border-radius:var(--r)}
.viewer-bar{display:flex;justify-content:flex-end;margin-bottom:8px}
.viewer-close{padding:6px 12px;font-size:12px;font-weight:500;background:var(--card);border:1px solid var(--border);
  border-radius:6px;color:var(--text-2);cursor:pointer;font-family:var(--sans)}
.viewer-close:hover{color:var(--text);border-color:var(--c2)}

/* ── CONTENT VIEWER ──────────────────────── */
.viewer-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px}
.viewer-title{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--c5);letter-spacing:-.2px}
.viewer-sub{font-size:12.5px;color:var(--text-3);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:20px;
  font-size:11.5px;font-weight:700;letter-spacing:.3px;flex-shrink:0;text-transform:uppercase}
.badge-xl{background:#EAF1EC;color:var(--c4)}
.badge-pdf{background:#F3EFE6;color:#7A5C2E}

.tabs-bar{display:flex;gap:2px;border-bottom:1.5px solid var(--border);margin-bottom:18px}
.sheet-tab{padding:8px 16px;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--text-2);
  background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1.5px;cursor:pointer}
.sheet-tab:hover{color:var(--text)}
.sheet-tab.active{color:var(--c4);border-bottom-color:var(--c3);font-weight:600}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;max-width:300px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-3)}
.search-input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--border);border-radius:7px;
  font-family:var(--sans);font-size:13px;color:var(--text);background:var(--card);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--c3)}
.search-input::placeholder{color:var(--text-3)}
.row-count{font-size:12px;color:var(--text-3);font-weight:500;white-space:nowrap}

.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--c5);color:rgba(255,255,255,.85);padding:11px 16px;text-align:left;
  font-size:11.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap;cursor:pointer;
  user-select:none;position:sticky;top:0;text-transform:uppercase}
thead th:hover{background:var(--c4)}
thead th.sort-asc::after{content:" ↑";color:var(--c2)}
thead th.sort-desc::after{content:" ↓";color:var(--c2)}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:nth-child(even){background:#FAFBFA}
tbody tr:hover{background:#F0F4F1}
tbody td{padding:10px 16px;white-space:nowrap}
tbody td:first-child{font-weight:600;color:var(--c5)}
.no-rows{text-align:center;padding:48px 20px;color:var(--text-3)}

/* ── PDF VIEWER ──────────────────────────── */
.pdf-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.pdf-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:var(--c5);flex-wrap:wrap}
.pdf-toolbar-group{display:flex;align-items:center;gap:6px}
.pdf-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:6px;
  color:#fff;cursor:pointer;font-size:14px;transition:background .15s}
.pdf-btn:hover{background:rgba(255,255,255,.18)}
.pdf-btn:disabled{opacity:.3;cursor:not-allowed}
.pdf-page-info{color:rgba(255,255,255,.8);font-size:12.5px;font-weight:500;min-width:64px;text-align:center}
.pdf-link{color:rgba(255,255,255,.55);font-size:12px;text-decoration:none;font-weight:500}
.pdf-link:hover{color:#fff}
.pdf-canvas-area{background:#E8EAE6;padding:24px;display:flex;flex-direction:column;
  align-items:center;gap:16px;max-height:calc(100vh - 280px);overflow-y:auto}
.pdf-canvas-area canvas{box-shadow:0 4px 20px rgba(0,0,0,.15);max-width:100%;height:auto}

/* ── CHART CARDS ─────────────────────────── */
.evolucion-block{margin-bottom:24px}
.stat-cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.stat-card-label{font-size:12px;color:var(--text-3);margin-bottom:9px;line-height:1.3}
.stat-card-value{font-family:var(--serif);font-size:23px;font-weight:700;color:var(--c5);letter-spacing:-.3px}
.stat-card-value.good{color:#167F5C}
.stat-card-value.warn{color:#AF5234}
.stat-card-sub{font-size:11.5px;color:var(--text-3);margin-top:4px}
.chart-card-full{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:24px}
.chart-card-title{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--c5);margin-bottom:3px}
.chart-card-subtitle{font-size:12px;color:var(--text-3);margin-bottom:14px}
.chart-card-legend{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.evolucion-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.evolucion-legend-dot{width:10px;height:10px;border-radius:3px}
.evolucion-scroll{overflow-x:auto}
.evolucion-canvas-wrap{height:320px;position:relative}
.promedios-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.promedio-mini{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:14px 16px}
.promedio-mini-label{font-size:11.5px;font-weight:600;color:var(--text-2);text-align:center;margin-bottom:10px}
.promedio-mini-wrap{height:130px;position:relative}
.tall-chart-wrap{height:520px;position:relative}
.scatter-chart-wrap{height:420px;position:relative}
.percentil-legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.percentil-scroll{overflow-y:auto}

/* ── AMPLIAR / FULLSCREEN ────────────────── */
.ampliar-btn{float:right;padding:5px 12px;font-size:12px;font-weight:500;
  background:var(--bg);border:1px solid var(--border);border-radius:5px;
  cursor:pointer;color:var(--text-2);font-family:var(--sans);transition:all .15s;margin-bottom:10px}
.ampliar-btn:hover{background:var(--border);color:var(--text)}
.chart-card-full.fullscreen{
  position:fixed!important;inset:0!important;z-index:4000!important;
  border-radius:0!important;margin:0!important;overflow-y:auto!important;padding:28px!important}

/* ── LOADING / ERROR ─────────────────────── */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 20px;gap:14px;color:var(--text-3);font-size:14px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--c3);
  border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-card{background:var(--err-bg);border:1px solid var(--err-border);border-radius:8px;
  padding:20px 24px;color:var(--err-text);font-size:13.5px;line-height:1.6}

/* ── SEGUIMIENTO INDIVIDUAL ──────────────── */
.seg-intro{margin-bottom:22px}
.seg-intro h2{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--c5);letter-spacing:-.3px}
.seg-intro p{font-size:13px;color:var(--text-3);margin-top:4px}
.seg-search{position:relative;max-width:460px;margin-bottom:28px}
.seg-search-input{width:100%;padding:13px 16px 13px 42px;border:1.5px solid var(--border);border-radius:9px;
  font-family:var(--sans);font-size:15px;color:var(--text);background:var(--card);outline:none;
  transition:border-color .15s,box-shadow .15s}
.seg-search-input:focus{border-color:var(--c3);box-shadow:0 0 0 3px rgba(82,121,111,.13)}
.seg-search-input::placeholder{color:var(--text-3)}
.seg-search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.seg-results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);
  border:1px solid var(--border);border-radius:9px;box-shadow:0 12px 32px rgba(47,62,70,.12);
  z-index:50;overflow:hidden;display:none}
.seg-results.open{display:block}
.seg-result{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:11px 16px;background:none;border:none;border-bottom:1px solid var(--border);
  font-family:var(--sans);font-size:14px;color:var(--text);cursor:pointer;text-align:left}
.seg-result:last-child{border-bottom:none}
.seg-result:hover,.seg-result.hl{background:#F0F4F1}
.seg-result mark{background:none;color:var(--c4);font-weight:700}
.seg-result-cat{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.seg-noresult{padding:14px 16px;font-size:13px;color:var(--text-3)}

.seg-player{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.seg-player-name{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--c5);letter-spacing:-.3px}
.seg-player-meta{font-size:13px;color:var(--text-2);display:flex;gap:18px;flex-wrap:wrap}
.seg-player-meta b{color:var(--c5);font-weight:600}
.seg-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-bottom:22px}
.seg-charts .chart-card-full{margin-bottom:0}
.seg-canvas{position:relative;height:340px}
.seg-key{display:flex;gap:16px;flex-wrap:wrap;margin:2px 0 12px;font-size:11.5px;color:var(--text-2)}
.seg-key span{display:inline-flex;align-items:center;gap:6px}
.seg-key i{display:inline-block;width:18px;height:9px;border-radius:2px}
.seg-ref-note{font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.5}
.seg-ref-note.prov{color:#8A6420}
.seg-empty{background:var(--card);border:1px dashed var(--border);border-radius:var(--r);
  padding:40px 24px;text-align:center;color:var(--text-3);font-size:13.5px;line-height:1.6}
.seg-warn{background:#FBF5E6;border:1px solid #EBD9A8;border-radius:8px;padding:12px 16px;
  font-size:13px;color:#7A5C1E;margin-bottom:18px;line-height:1.55}
.seg-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.seg-table th.num{text-align:right}
.pct-chip{display:inline-block;min-width:38px;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;text-align:center}

<body>

<script>
// ═══════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════
let manifest=null,activeData=[],sortState={col:-1,dir:'asc'},sheets={},activeFile=null,sheetNames=[];
let pdfDoc=null,pdfScale=1.1;
const SESSION_KEY='portal_auth_v1';
Chart.register(ChartDataLabels);

// ═══════════════════════════════════════════
// PLUGINS
// ═══════════════════════════════════════════
const refLinesPlugin={
  id:'refLines',
  afterDraw(chart,args,opts){
    if(!opts?.lines) return;
    const{ctx,chartArea,scales}=chart;
    opts.lines.forEach(line=>{
      const scale=scales[line.axis]; if(!scale) return;
      const pix=scale.getPixelForValue(line.value);
      ctx.save();
      ctx.strokeStyle=line.color||'#9FACA3';
      ctx.setLineDash([4,4]); ctx.lineWidth=1;
      ctx.beginPath();
      if(line.axis==='x'){ctx.moveTo(pix,chartArea.top);ctx.lineTo(pix,chartArea.bottom);}
      else{ctx.moveTo(chartArea.left,pix);ctx.lineTo(chartArea.right,pix);}
      ctx.stroke();
      if(line.label){
        ctx.setLineDash([]);
        ctx.font='10px Inter,system-ui,sans-serif';
        ctx.fillStyle=line.color||'#9FACA3';
        if(line.axis==='x'){ctx.textAlign='center';ctx.fillText(line.label,pix,chartArea.top-4);}
        else{ctx.textAlign='right';ctx.fillText(line.label,chartArea.right-4,pix-4);}
      }
      ctx.restore();
    });
  }
};
Chart.register(refLinesPlugin);

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
async function sha256(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

async function submitLogin(){
  const input=document.getElementById('passInput').value; if(!input) return;
  const btn=document.getElementById('loginBtn'),sp=document.getElementById('loginSpinner'),
    bt=document.getElementById('loginBtnText'),err=document.getElementById('loginError');
  btn.disabled=true;sp.style.display='block';bt.style.display='none';err.classList.remove('visible');
  try{
    const r=await fetch('manifest.json?_='+Date.now()); const m=await r.json();
    if(await sha256(input)===m.passwordHash){
      sessionStorage.setItem(SESSION_KEY,'ok');
      document.getElementById('loginOverlay').style.display='none';
      initApp(m);
    }else{err.classList.add('visible');document.getElementById('passInput').value='';document.getElementById('passInput').focus();}
  }catch(e){err.textContent='Error al conectar.';err.classList.add('visible');}
  btn.disabled=false;sp.style.display='none';bt.style.display='inline';
}

function togglePass(){
  const i=document.getElementById('passInput'),isP=i.type==='password';
  i.type=isP?'text':'password';
  document.getElementById('eyeIcon').innerHTML=isP
    ?`<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
    :`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}

function logout(){if(!confirm('¿Cerrar sesión?'))return;sessionStorage.removeItem(SESSION_KEY);location.reload();}

async function checkSession(){
  try{
    const r=await fetch('manifest.json?_='+Date.now());const m=await r.json();
    document.getElementById('loginTitle').textContent=m.nombre||'Portal';
    document.getElementById('loginAuthor').textContent=m.creador?'Creado por '+m.creador:'';
    if(sessionStorage.getItem(SESSION_KEY)==='ok'){
      document.getElementById('loginOverlay').style.display='none';initApp(m);
    }
  }catch(e){}
}

// ═══════════════════════════════════════════
// APP INIT
// ═══════════════════════════════════════════
function initApp(m){
  manifest=m;
  document.getElementById('brandTitle').textContent=m.nombre||'Portal';
  document.getElementById('brandSub').textContent=m.creador?'Creado por '+m.creador:'';
  document.title=m.nombre||'Portal';
  buildTopTabs(); showHome(); bienvenidaInicio();
}

function buildTopTabs(){
  let html=`<button class="top-tab active" id="tab-home" onclick="showHome()">Inicio</button>`;
  html+=`<button class="top-tab" id="tab-seguimiento" onclick="showSeguimiento()">Seguimiento</button>`;
  manifest.categorias.forEach(c=>{
    html+=`<button class="top-tab" id="tab-${c.id}" onclick="showCategory('${c.id}')">${c.nombre}</button>`;
  });
  document.getElementById('topTabs').innerHTML=html;
}

function setActiveTab(id){
  document.querySelectorAll('.top-tab').forEach(b=>b.classList.remove('active'));
  const t=document.getElementById('tab-'+id);
  if(t){ t.classList.add('active'); try{ t.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){} }
}

// ═══════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════
function showHome(){
  setActiveTab('home');
  document.getElementById('main').innerHTML=`
    <div class="home-hero">
      <img src="logo.png" alt="Escudo">
      <h1>${manifest.nombre}</h1>
      <p>${manifest.creador?'Creado por '+manifest.creador:''}</p>
    </div>
    <div class="section-label">Resumen del seguimiento</div>
    <div class="logros-grid" id="homeStats">${[1,2,3,4].map(()=>`<div class="logro-card logro-skel"><div class="logro-valor">&nbsp;</div><div class="logro-label">&nbsp;</div></div>`).join('')}</div>
    <div class="home-note" id="homeNote"></div>
    <div class="section-label">Categorías</div>
    <div class="cats-grid">${manifest.categorias.map(c=>`
      <button type="button" class="cat-card" onclick="showCategory('${c.id}')">
        <div class="cat-card-title">${c.nombre}</div>
        <div class="cat-card-meta" id="catMeta-${c.id}">${(c.informes||[]).length} ${(c.informes||[]).length===1?'informe':'informes'} · ${(c.excels||[]).length} ${(c.excels||[]).length===1?'planilla':'planillas'}</div>
      </button>`).join('')}
    </div>`;
  homeFillStats();
}

// Calcula el resumen desde seguimiento.xlsx; si no está, usa los logros escritos en el manifest.
async function homeFillStats(){
  let data=null;
  try{ if(!segDataPromise) segDataPromise=segLoad(); data=await segDataPromise; }catch(e){ segDataPromise=null; }
  const box=document.getElementById('homeStats'); if(!box) return;
  const card=(v,l)=>`<div class="logro-card"><div class="logro-valor">${v}</div><div class="logro-label">${l}</div></div>`;
  if(!data||data.missing||!data.list.length){
    segDataPromise=null;
    const logros=manifest.logros||[];
    box.innerHTML=logros.map(l=>card(segEsc(l.valor),segEsc(l.label))).join('');
    if(!logros.length) box.previousElementSibling.remove(), box.remove();
    return;
  }
  const st=segStats(data.list);
  box.innerHTML=card(st.jugadores,'Jugadores en seguimiento')+card(st.mediciones,'Mediciones registradas')
    +card(st.cats.size,st.cats.size===1?'Categoría':'Categorías')
    +card(st.ultima?st.ultima.toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'—','Última medición');
  document.getElementById('homeNote').textContent='Se actualiza solo cada vez que se sube una planilla de seguimiento nueva.';
  manifest.categorias.forEach(c=>{
    const el=document.getElementById('catMeta-'+c.id); const cs=st.porCat[c.id];
    if(!el||!cs) return;
    const inf=(c.informes||[]).length;
    el.innerHTML=`${cs.jugadores} jugadores · ${cs.ultima?'última medición '+segFmtDate(cs.ultima):'faltan cargar las fechas'}<br>${inf} ${inf===1?'informe':'informes'}`;
  });
}

function segStats(list){
  const st={jugadores:list.length,mediciones:0,cats:new Set(),ultima:null,porCat:{}};
  list.forEach(p=>{
    st.mediciones+=p.meds.length; if(p.cat) st.cats.add(p.cat);
    const c=st.porCat[p.cat]||(st.porCat[p.cat]={jugadores:0,ultima:null}); c.jugadores++;
    p.meds.forEach(m=>{ if(m.date){ if(!st.ultima||m.date>st.ultima) st.ultima=m.date; if(!c.ultima||m.date>c.ultima) c.ultima=m.date; } });
  });
  return st;
}

// ═══════════════════════════════════════════
// CATEGORY VIEW
// ═══════════════════════════════════════════
function showCategory(catId){
  setActiveTab(catId);
  const cat=manifest.categorias.find(c=>c.id===catId);
  const todos=cat.indicadores||[];
  const minis=todos.filter(i=>i.tipo==='dona');
  const fulls=todos.filter(i=>i.tipo!=='dona');
  const inf=cat.informes||[], exc=cat.excels||[];
  const docs=[
    ...inf.map((f,i)=>`<button class="chip doc-chip" id="chip-p-${i}" onclick="openPDF('${catId}',${i})"><span class="doc-tag pdf">PDF</span>${segEsc(f.nombre)}</button>`),
    ...exc.map((f,i)=>`<button class="chip doc-chip" id="chip-x-${i}" onclick="openExcel('${catId}',${i})"><span class="doc-tag xls">XLS</span>${segEsc(f.nombre)}</button>`)
  ];
  docs.push(`<button class="chip doc-chip doc-link" onclick="segCurrent=null;segCatFilter='${catId}';showSeguimiento()">Ver el plantel en Seguimiento →</button>`);

  document.getElementById('main').innerHTML=`
    <div class="cat-header"><h2>${cat.nombre}</h2></div>
    <div class="section-label">Informes y planillas</div>
    <div class="chips doc-row">${docs.join('')}</div>
    ${(inf.length||exc.length)?'':'<div class="chip-empty" style="margin:-14px 0 24px">Todavía no hay informes ni planillas cargados en esta categoría.</div>'}
    <div id="viewerArea"></div>
    ${todos.length?'<div class="section-label">Indicadores</div>':''}
    ${minis.length?'<div class="indicadores-grid" id="indicadoresGrid"></div>':''}
    ${fulls.map((_,i)=>`<div class="evolucion-block" id="ind-${i}"></div>`).join('')}`;

  if(minis.length) renderDonas(minis);
  fulls.forEach((ind,i)=>renderFull(ind,i));
}

function closeViewer(){
  const v=document.getElementById('viewerArea'); if(v) v.innerHTML='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
}

function setChipActive(id){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}

// ═══════════════════════════════════════════
// CHART DISPATCHER
// ═══════════════════════════════════════════
function renderFull(ind,idx){
  switch(ind.tipo){
    case 'evolucion':             renderEvolucion(ind,idx); break;
    case 'comparacion-promedios': renderComparacionPromedios(ind,idx); break;
    case 'barras-grupo':          renderBarrasGrupo(ind,idx); break;
    case 'maduracion':            renderMaduracion(ind,idx); break;
    case 'dispersion':            renderDispersion(ind,idx); break;
    case 'percentil':             renderPercentil(ind,idx); break;
  }
}

function toggleFullscreen(cardId){
  const card=document.getElementById(cardId);
  const isFs=card.classList.toggle('fullscreen');
  card.querySelector('.ampliar-btn').textContent=isFs?'✕ Cerrar':'⛶ Ampliar';
  if(!isFs) card.scrollTop=0;
}

// ═══════════════════════════════════════════
// DONAS (mini chips en grid)
// ═══════════════════════════════════════════
// Colores de zona: los mismos en todo el portal (validados para daltonismo).
const ZONA={
  dentro:{color:'#167F5C',soft:'#E3F0EA',ink:'#11573F',label:'Dentro de lo esperado'},
  vigilar:{color:'#CA933E',soft:'#F7ECD9',ink:'#7A5414',label:'A vigilar'},
  encima:{color:'#AF5234',soft:'#F5E1DA',ink:'#7E3520',label:'Por encima del rango'},
  debajo:{color:'#4A8CC1',soft:'#E1ECF5',ink:'#245A85',label:'Por debajo del rango'}
};
// Colores de período (antes / después): neutros, para no confundirlos con zonas.
const PERIODO={antes:'#A9C2B8',despues:'#354F52'};
function zonaTint(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function zonaPorTexto(txt,hayMuy){
  const s=segNorm(txt);
  if(/muy elev|exceso|obesid/.test(s)) return 'encima';
  if(/\bbajo/.test(s)) return 'debajo';
  if(/bien|optim|adecuad|normal|\bok\b/.test(s)) return 'dentro';
  if(/aceptab|sobrepes/.test(s)) return 'vigilar';
  if(/elevad/.test(s)) return hayMuy?'vigilar':'encima';
  return null;
}
function zonasDeEtiquetas(labels){
  const hayMuy=labels.some(l=>/muy elev|exceso|obesid/.test(segNorm(l)));
  const orden=labels.length>=4?['debajo','dentro','vigilar','encima']:['dentro','vigilar','encima'];
  return labels.map((l,i)=>zonaPorTexto(l,hayMuy)||orden[Math.min(i,orden.length-1)]);
}

function renderDonas(inds){
  const grid=document.getElementById('indicadoresGrid');
  if(!grid) return;
  grid.innerHTML=inds.map((ind,i)=>`
    <div class="indicador-card">
      <div class="indicador-title">${ind.titulo}</div>
      <div class="indicador-chart-wrap"><canvas id="chart-${i}"></canvas></div>
      <div class="indicador-legend" id="legend-${i}"></div>
    </div>`).join('');
  inds.forEach((ind,i)=>{
    const labels=ind.datos.map(d=>d.etiqueta),values=ind.datos.map(d=>d.valor);
    const colors=zonasDeEtiquetas(labels).map(z=>ZONA[z].color);
    new Chart(document.getElementById(`chart-${i}`),{
      type:'doughnut',
      data:{labels,datasets:[{data:values,backgroundColor:colors,borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},datalabels:{display:false}},cutout:'62%'}
    });
    const total=values.reduce((a,b)=>a+b,0);
    document.getElementById(`legend-${i}`).innerHTML=ind.datos.map((d,j)=>`
      <div class="legend-row">
        <span class="legend-dot" style="background:${colors[j]}"></span>
        <span>${d.etiqueta}</span>
        <span class="legend-val">${d.valor}/${total}</span>
      </div>`).join('');
  });
}

// ═══════════════════════════════════════════
// EVOLUCIÓN (barras agrupadas + stat cards + ref lines Y)
// ═══════════════════════════════════════════
function renderEvolucion(ind,idx){
  const p1=ind.jugadores.map(j=>j.p1),p2=ind.jugadores.map(j=>j.p2),total=ind.jugadores.length;
  const avg1=p1.reduce((a,b)=>a+b,0)/total,avg2=p2.reduce((a,b)=>a+b,0)/total;
  const mejora=avg2-avg1,mejoraPct=(mejora/avg1)*100;
  const uOpt=ind.umbral_optimo||0,uEle=ind.umbral_elevado||999;
  const zona=v=>v<=uOpt?'Zona óptima':v>uEle?'Zona elevada':'Zona aceptable';
  const opt1=p1.filter(v=>v<=uOpt).length,opt2=p2.filter(v=>v<=uOpt).length;
  const ele1=p1.filter(v=>v>uEle).length,ele2=p2.filter(v=>v>uEle).length;
  const mClass=mejora<=0?'good':'warn',mSign=mejora>0?'+':'';
  const minW=Math.max(600,total*32);

// EXCEL VIEWER
// ═══════════════════════════════════════════
async function openExcel(catId,idx){
  const cat=manifest.categorias.find(c=>c.id===catId);
  const file=(cat.excels||[])[idx];
  setChipActive(`chip-x-${idx}`);
  setViewer(`<div class="loading-state"><div class="spinner"></div><div>Cargando ${file.nombre}…</div></div>`);
  try{
    const r=await fetch(`archivos/${catId}/excel/${file.archivo}?_=${Date.now()}`);
    if(!r.ok) throw new Error(`Archivo no encontrado: ${file.archivo}`);
    const buf=await r.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    sheets={};
    wb.SheetNames.forEach(name=>{
      const data=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''});
      if(data.length) sheets[name]=data;
    });
    const names=Object.keys(sheets);
    if(!names.length) throw new Error('El archivo no tiene datos tabulares.');
    activeFile=file; sheetNames=names; renderExcel(names[0]);
  }catch(err){showViewerError(err.message);}
}

function renderExcel(activeSheet){
  const data=sheets[activeSheet]||[];activeData=data;sortState={col:-1,dir:'asc'};
  const cols=data.length?Object.keys(data[0]):[];
  const tabsHTML=sheetNames.length>1?`<div class="tabs-bar">${sheetNames.map(n=>
    `<button class="sheet-tab${n===activeSheet?' active':''}" onclick="renderExcel('${n.replace(/'/g,"\\'")}')">
    ${n}</button>`).join('')}</div>`:'';
  setViewer(`
    <div class="viewer-header">
      <div><div class="viewer-title">${activeFile.nombre}</div>
        <div class="viewer-sub">${activeSheet} · ${data.length} registros</div></div>
      <span class="badge badge-xl">Excel</span>
    </div>${tabsHTML}
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar…" oninput="filterTable()">
      </div>
      <span class="row-count" id="rowCount">${data.length} registros</span>
    </div>
    <div class="table-card"><table>
      <thead><tr>${cols.map((c,i)=>`<th onclick="sortTable(${i},'${c.replace(/'/g,"\\'")}')">
        ${c}</th>`).join('')}</tr></thead>
      <tbody id="tbody">${buildRows(data,cols)}</tbody>
    </table></div>`);
}

function buildRows(data,cols){
  if(!data.length) return`<tr><td class="no-rows" colspan="${cols.length||1}">Sin resultados</td></tr>`;
  return data.map(row=>`<tr>${cols.map(c=>`<td>${row[c]??''}</td>`).join('')}</tr>`).join('');
}

function filterTable(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const cols=activeData.length?Object.keys(activeData[0]):[];
  const out=q?activeData.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q))):activeData;
  document.getElementById('tbody').innerHTML=buildRows(out,cols);
  document.getElementById('rowCount').textContent=`${out.length} registros`;
}

function sortTable(colIdx,colName){
  document.querySelectorAll('thead th').forEach(t=>t.classList.remove('sort-asc','sort-desc'));
  sortState.dir=sortState.col===colIdx?(sortState.dir==='asc'?'desc':'asc'):'asc';
  sortState.col=colIdx;
  document.querySelectorAll('thead th')[colIdx].classList.add(`sort-${sortState.dir}`);
  const cols=activeData.length?Object.keys(activeData[0]):[];
  activeData=[...activeData].sort((a,b)=>{
    const va=a[colName],vb=b[colName];
    const na=parseFloat(va),nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb)) return sortState.dir==='asc'?na-nb:nb-na;
    return sortState.dir==='asc'?String(va).localeCompare(String(vb),'es'):String(vb).localeCompare(String(va),'es');
  });
  const q=document.getElementById('searchInput')?.value.toLowerCase().trim()||'';
  const out=q?activeData.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q))):activeData;
  document.getElementById('tbody').innerHTML=buildRows(out,cols);
  document.getElementById('rowCount').textContent=`${out.length} registros`;
}

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function openPDF(catId,idx){
  const cat=manifest.categorias.find(c=>c.id===catId);
  const file=(cat.informes||[])[idx];
  setChipActive(`chip-p-${idx}`);
  const url=`archivos/${catId}/informes/${file.archivo}`;
  setViewer(`
    <div class="viewer-header">
      <div><div class="viewer-title">${file.nombre}</div><div class="viewer-sub">${file.fecha||''}</div></div>
      <span class="badge badge-pdf">PDF</span>
    </div>
    <div class="pdf-card">
      <div class="pdf-toolbar">
        <div class="pdf-toolbar-group">
          <button class="pdf-btn" onclick="pdfZoom(-.15)">−</button>
          <button class="pdf-btn" onclick="pdfZoom(.15)">+</button>
        </div>
        <span class="pdf-page-info" id="pdfPageInfo">Cargando…</span>
        <a class="pdf-link" href="${url}" target="_blank">Abrir original ↗</a>
      </div>
      <div class="pdf-canvas-area" id="pdfCanvasArea">
        <div class="loading-state"><div class="spinner"></div></div>
      </div>
    </div>`);
  try{
    pdfDoc=await pdfjsLib.getDocument(url).promise;
    pdfScale=1.1; await renderAllPdfPages();
  }catch(err){document.getElementById('pdfCanvasArea').innerHTML=`<div class="error-card">${err.message}</div>`;}
}

async function renderAllPdfPages(){
  const area=document.getElementById('pdfCanvasArea'); area.innerHTML='';
  document.getElementById('pdfPageInfo').textContent=`${pdfDoc.numPages} página${pdfDoc.numPages>1?'s':''}`;
  for(let n=1;n<=pdfDoc.numPages;n++){
    const page=await pdfDoc.getPage(n);
    const vp=page.getViewport({scale:pdfScale});
    const canvas=document.createElement('canvas');
    canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    area.appendChild(canvas);
  }
}

function pdfZoom(delta){
  if(!pdfDoc)return;
  pdfScale=Math.min(2.4,Math.max(0.5,pdfScale+delta));
  renderAllPdfPages();
}

// ═══════════════════════════════════════════
// SEGUIMIENTO INDIVIDUAL (peso y talla longitudinal + percentilos)
//   Datos:       archivos/seguimiento.xlsx  (hojas "Jugadores" y "Mediciones")
//   Referencias: referencias.json           (tablas LMS por edad, varones)
// ═══════════════════════════════════════════
const SEG_FILE='archivos/seguimiento.xlsx';
const REF_FILE='referencias.json';
const PCTS=[3,10,25,50,75,90,97];
const PCT_Z={3:-1.880794,10:-1.281552,25:-0.67449,50:0,75:0.67449,90:1.281552,97:1.880794};
const MS_YEAR=365.25*864e5;
let segDataPromise=null, segCharts=[], segCurrent=null, segDataCache=null, segCatFilter='todas', segSoloFuera=false;

function segNorm(s){
  return String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
}
function segEsc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function segNum(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number') return isFinite(v)&&v>0?v:null;
  const n=parseFloat(String(v).trim().replace(',','.'));
  return isFinite(n)&&n>0?n:null;
}
function segDate(v){
  if(v===null||v===undefined||v==='') return null;
  if(v instanceof Date) return new Date(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'){ // número de serie de Excel
    const p=XLSX.SSF.parse_date_code(v); return p?new Date(p.y,p.m-1,p.d):null;
  }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]);}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}
function segFmt(n,d=1){return n==null?'—':n.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function segFmtDate(d){return d?d.toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}):'sin fecha';}
function segAge(dob,date){return (dob&&date)?(date-dob)/MS_YEAR:null;}

// Busca una columna por encabezado, tolerando tildes, mayúsculas y unidades entre paréntesis
function segCol(row,...names){
  const keys=Object.keys(row);
  for(const n of names){
    const k=keys.find(k=>segNorm(k).replace(/\(.*?\)/g,'').trim()===n);
    if(k!==undefined) return row[k];
  }
  return null;
}

async function segLoad(){
  const [xls,ref]=await Promise.all([
    fetch(SEG_FILE+'?_='+Date.now()).then(r=>r.ok?r.arrayBuffer():null).catch(()=>null),
    fetch(REF_FILE+'?_='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  if(!xls) return {missing:true,ref};
  const wb=XLSX.read(xls,{type:'array'});
  const sheet=name=>{
    const real=wb.SheetNames.find(n=>segNorm(n)===name);
    return real?XLSX.utils.sheet_to_json(wb.Sheets[real],{defval:null,raw:true}):[];
  };
  const players=new Map(), orphans=new Set();
  sheet('jugadores').forEach(r=>{
    const name=segCol(r,'jugador','nombre'); if(!name) return;
    const key=segNorm(name);
    players.set(key,{key,name:String(name).trim(),cat:String(segCol(r,'categoria')??'').trim(),
      dob:segDate(segCol(r,'fecha de nacimiento','nacimiento','fecha nacimiento')),meds:[]});
  });
  sheet('mediciones').forEach(r=>{
    const name=segCol(r,'jugador','nombre'); if(!name) return;
    const key=segNorm(name);
    const peso=segNum(segCol(r,'peso')), talla=segNum(segCol(r,'talla'));
    if(peso==null&&talla==null) return;
    if(!players.has(key)){players.set(key,{key,name:String(name).trim(),cat:'',dob:null,meds:[]});orphans.add(String(name).trim());}
    players.get(key).meds.push({date:segDate(segCol(r,'fecha de medicion','fecha')),peso,talla,
      obs:String(segCol(r,'observaciones','observacion')??'').trim()});
  });
  players.forEach(p=>p.meds.sort((a,b)=>(a.date??Infinity)-(b.date??Infinity)));
  const list=[...players.values()].filter(p=>p.meds.length).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  return {list,ref,orphans:[...orphans]};
}

// ── LMS: interpolación por edad, percentil ↔ valor ──
function segLMS(table,age){
  if(!table||!table.length||age<table[0][0]||age>table[table.length-1][0]) return null;
  let i=0; while(i<table.length-2&&table[i+1][0]<age) i++;
  const a=table[i],b=table[i+1],t=(age-a[0])/(b[0]-a[0]);
  return [a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,a[3]+(b[3]-a[3])*t];
}
function segValueAt(lms,z){const[L,M,S]=lms;return Math.abs(L)<1e-6?M*Math.exp(S*z):M*Math.pow(1+L*S*z,1/L);}
function segNormCdf(z){ // Abramowitz-Stegun 7.1.26
  const t=1/(1+0.3275911*Math.abs(z)/Math.SQRT2);
  const e=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z/2);
  return z>=0?(1+e)/2:(1-e)/2;
}
function segPercentile(table,age,x){
  const lms=segLMS(table,age); if(!lms||x==null) return null;
  const[L,M,S]=lms;
  const z=Math.abs(L)<1e-6?Math.log(x/M)/S:(Math.pow(x/M,L)-1)/(L*S);
  return Math.min(99.9,Math.max(0.1,segNormCdf(z)*100));
}
function segPctChip(p){
  if(p==null) return '<span style="color:var(--text-3)">—</span>';
  const r=Math.round(p), z=ZONA[p<3?'debajo':p>97?'encima':'dentro'];
  const label=p<1?'&lt;P1':p>99?'&gt;P99':'P'+r;
  return `<span class="pct-chip" style="background:${z.soft};color:${z.ink}">${label}</span>`;
}

function segWireSearch(input,data){
  const box=document.getElementById('segResults');
  let matches=[],hl=0;
  const close=()=>{box.classList.remove('open');input.setAttribute('aria-expanded','false');};
  const pick=p=>{segCurrent=p.key;input.value=p.name;close();segRenderPlayer(p,data.ref);};
  const draw=()=>{
    const q=segNorm(input.value);
    if(q.length<2){close();return;}
    const toks=q.split(' ');
    matches=data.list.filter(p=>toks.every(t=>p.key.includes(t)))
      .sort((a,b)=>{
        const sa=a.key.split(' ').some(w=>w.startsWith(toks[0]))?0:1, sb=b.key.split(' ').some(w=>w.startsWith(toks[0]))?0:1;
        return sa-sb||a.name.localeCompare(b.name,'es');
      }).slice(0,8);
    hl=0;
    box.innerHTML=matches.length?matches.map((p,i)=>{
      const idx=p.key.indexOf(toks[0]);
      const nm=idx<0?segEsc(p.name):segEsc(p.name.slice(0,idx))+'<mark>'+segEsc(p.name.slice(idx,idx+toks[0].length))+'</mark>'+segEsc(p.name.slice(idx+toks[0].length));
      return `<button type="button" class="seg-result${i===0?' hl':''}" role="option" data-i="${i}">
        <span>${nm}</span><span class="seg-result-cat">${p.cat?'Cat. '+segEsc(p.cat)+' · ':''}${p.meds.length} med.</span></button>`;
    }).join(''):`<div class="seg-noresult">No hay jugadores que coincidan con “${segEsc(input.value)}”.</div>`;
    box.classList.add('open');input.setAttribute('aria-expanded','true');
    box.querySelectorAll('.seg-result').forEach(b=>b.addEventListener('mousedown',e=>{e.preventDefault();pick(matches[+b.dataset.i]);}));
  };
  const move=d=>{
    const items=box.querySelectorAll('.seg-result'); if(!items.length) return;
    items[hl]?.classList.remove('hl'); hl=(hl+d+items.length)%items.length; items[hl].classList.add('hl');
  };
  input.addEventListener('input',draw);
  input.addEventListener('focus',()=>{if(input.value&&!segCurrent)draw();});
  input.addEventListener('blur',()=>setTimeout(close,120));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();move(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}
    else if(e.key==='Enter'){if(matches[hl]&&box.classList.contains('open')){e.preventDefault();pick(matches[hl]);}}
    else if(e.key==='Escape') close();
    else segCurrent=null;
  });
}

// Última medición de cada jugador y sus percentilos (se calcula una vez y se guarda)
function segUltimos(p,ref){
  if(p._ult) return p._ult;
  const refT={peso:ref?.peso?.varones,talla:ref?.talla?.varones};
  const last=k=>{let b=null; p.meds.forEach(m=>{ if(m[k]==null) return; if(!b||(m.date&&(!b.date||m.date>=b.date))) b=m; }); return b;};
  const mp=last('peso'), mt=last('talla');
  const ultima=p.meds.reduce((a,m)=>m.date&&(!a||m.date>a)?m.date:a,null);
  const pc=(m,k)=>(m&&p.dob&&m.date)?segPercentile(refT[k],segAge(p.dob,m.date),m[k]):null;
  const pp=pc(mp,'peso'), pt=pc(mt,'talla');
  return p._ult={peso:mp?mp.peso:null,talla:mt?mt.talla:null,pp,pt,ultima,edad:segAge(p.dob,ultima),
    fuera:[pp,pt].some(v=>v!=null&&(v<3||v>97))};
}

        <th class="num hm">Peso (kg)</th><th>Pc peso</th><th class="num hm">Talla (cm)</th><th>Pc talla</th></tr></thead>
      <tbody>${rows.length?rows.map(({p,u})=>`<tr class="plantel-row${u.fuera?' fuera':''}" tabindex="0" data-key="${segEsc(p.key)}">
          <td><span class="plantel-name">${segEsc(p.name)}</span><span class="plantel-sub">Cat. ${segEsc(p.cat||'—')} · ${segFmt(u.peso)} kg · ${segFmt(u.talla)} cm${p.dob?'':' · sin fecha nac.'}</span></td>

          <td class="num hm">${u.edad!=null?segFmt(u.edad):(p.dob?'—':'<span class="muted" title="Falta la fecha de nacimiento">s/ fecha nac.</span>')}</td>
          <td class="num hm">${segFmt(u.peso)}</td><td>${segPctChip(u.pp)}</td>
          <td class="num hm">${segFmt(u.talla)}</td><td>${segPctChip(u.pt)}</td></tr>`).join('')
        :`<tr><td colspan="8" class="no-rows">No hay jugadores fuera del rango P3–P97 en esta selección.</td></tr>`}</tbody>

  body.querySelectorAll('.plantel-row').forEach(tr=>{

function segRenderPlayer(p,ref){
  segCharts.forEach(c=>c.destroy()); segCharts=[];
  const body=document.getElementById('segBody'); if(!body) return;
  const today=new Date(), ageNow=segAge(p.dob,today);
  const dated=p.meds.filter(m=>m.date);
  const pts=m=>({age:segAge(p.dob,m.date)});
  const warns=[];
  if(!p.dob) warns.push('Falta la <b>fecha de nacimiento</b> de este jugador en la hoja “Jugadores”. Sin ese dato no se puede calcular la edad ni ubicarlo en las curvas; abajo se muestran solo sus mediciones.');
  if(p.meds.length>dated.length) warns.push(`${p.meds.length-dated.length} medición(es) sin <b>fecha de medición</b>: aparecen en la tabla pero no en los gráficos.`);
  if(!ref) warns.push('No se encontró el archivo de referencias de percentilos (referencias.json): los gráficos se muestran sin bandas.');

  const refT={peso:ref?.peso?.varones, talla:ref?.talla?.varones};
  const prov=ref&&/provisori/i.test(ref.nombre||'');
  const canChart=p.dob&&dated.length>0;

  let prevP=null,prevT=null;
  const rows=p.meds.map(m=>{
    const age=segAge(p.dob,m.date);
    const pp=age!=null?segPercentile(refT.peso,age,m.peso):null;
    const pt=age!=null?segPercentile(refT.talla,age,m.talla):null;
    const dP=(m.peso!=null&&prevP!=null)?m.peso-prevP:null, dT=(m.talla!=null&&prevT!=null)?m.talla-prevT:null;
    if(m.peso!=null) prevP=m.peso; if(m.talla!=null) prevT=m.talla;
    const sg=v=>v==null?'<span style="color:var(--text-3)">—</span>':(v>0?'+':'')+segFmt(v);
    return `<tr><td>${segFmtDate(m.date)}</td><td class="num">${age!=null?segFmt(age):'—'}</td>
      <td class="num">${segFmt(m.peso)}</td><td class="num">${sg(dP)}</td><td>${segPctChip(pp)}</td>
      <td class="num">${segFmt(m.talla)}</td><td class="num">${sg(dT)}</td><td>${segPctChip(pt)}</td>
      <td style="white-space:normal;color:var(--text-2);font-size:12.5px">${segEsc(m.obs)}</td></tr>`;
  }).join('');

  const key=`<div class="seg-key">
      <span><i style="background:rgba(82,121,111,.30)"></i>P25–P75</span>
      <span><i style="background:rgba(82,121,111,.17)"></i>P10–P90</span>
      <span><i style="background:rgba(82,121,111,.10)"></i>P3–P97</span>
      <span><i style="height:0;border-top:1.5px dashed rgba(53,79,82,.7);border-radius:0"></i>P50</span>
      <span><i style="width:10px;height:10px;border-radius:50%;background:#2F3E46"></i>${segEsc(p.name.split(' ')[0])}</span>
    </div>`;
  const card=(id,title)=>`<div class="chart-card-full" id="segCard-${id}">
      <button class="ampliar-btn" onclick="toggleFullscreen('segCard-${id}')">⛶ Ampliar</button>
      <div class="chart-card-title">${title}</div>${key}
      <div class="seg-canvas"><canvas id="segChart-${id}"></canvas></div></div>`;

  body.innerHTML=`
    <button type="button" class="seg-back" onclick="segVolverPlantel()">← Volver al plantel</button>
    <div class="seg-player">
      <div class="seg-player-name">${segEsc(p.name)}</div>
      <div class="seg-player-meta">
        ${p.cat?`<span>Categoría <b>${segEsc(p.cat)}</b></span>`:''}
        ${ageNow!=null?`<span>Edad actual <b>${segFmt(ageNow)} años</b></span>`:''}
        <span><b>${p.meds.length}</b> ${p.meds.length===1?'medición':'mediciones'}</span>
      </div>
    </div>
    ${warns.map(w=>`<div class="seg-warn">${w}</div>`).join('')}
    ${canChart?`<div class="seg-charts">${card('peso','Peso para la edad')}${card('talla','Talla para la edad')}</div>`:''}
    <div class="section-label">Mediciones</div>
    <div class="table-card seg-table"><table>
      <thead><tr><th>Fecha</th><th class="num">Edad (años)</th><th class="num">Peso (kg)</th><th class="num">Δ peso</th><th>Pc peso</th>
        <th class="num">Talla (cm)</th><th class="num">Δ talla</th><th>Pc talla</th><th>Observaciones</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${ref?`<div class="seg-ref-note${prov?' prov':''}">Percentilos calculados con ${segEsc(ref.nombre)} (método LMS).${ref.nota?' '+segEsc(ref.nota):''}</div>`:''}`;

  if(canChart){
    segCharts.push(segChart('peso',p,refT.peso,'kg','Peso'));
    segCharts.push(segChart('talla',p,refT.talla,'cm','Talla'));
  }
}

function segChart(kind,p,table,unit,label){
  const obs=p.meds.filter(m=>m.date&&m[kind]!=null).map(m=>{
    const age=segAge(p.dob,m.date);
    return {x:age,y:m[kind],date:m.date,pct:segPercentile(table,age,m[kind])};
  });
  const ages=p.meds.filter(m=>m.date).map(m=>segAge(p.dob,m.date));
  let lo=Math.min(...ages)-0.6, hi=Math.max(...ages)+0.6;
  if(hi-lo<2){const c=(hi+lo)/2; lo=c-1; hi=c+1;}
  if(table){lo=Math.max(lo,table[0][0]); hi=Math.min(hi,table[table.length-1][0]);}
  lo=Math.floor(lo*2)/2; hi=Math.ceil(hi*2)/2;

  const curve=z=>{const out=[]; for(let a=lo;a<=hi+1e-9;a+=0.05){const l=segLMS(table,a); if(l) out.push({x:+a.toFixed(3),y:segValueAt(l,z)});} return out;};
  const band='82,121,111';
  const refDs=(pc,fill,bg,extra={})=>({label:'P'+pc,data:table?curve(PCT_Z[pc]):[],_ref:pc,
    borderColor:`rgba(${band},.28)`,borderWidth:1,pointRadius:0,pointHitRadius:0,tension:0.2,
    fill:fill,backgroundColor:bg,order:2,...extra});
  const datasets=[
    refDs(3,false,'transparent'),
    refDs(97,0,`rgba(${band},.10)`),
    refDs(10,false,'transparent'),
    refDs(90,2,`rgba(${band},.09)`),
    refDs(25,false,'transparent'),
    refDs(75,4,`rgba(${band},.13)`),
    refDs(50,false,'transparent',{borderColor:'rgba(53,79,82,.7)',borderWidth:1.5,borderDash:[5,4]}),
    {label:p.name,data:obs,_player:true,order:1,borderColor:'#2F3E46',borderWidth:2,tension:0,
      pointRadius:5.5,pointHoverRadius:7,pointHitRadius:14,pointBackgroundColor:'#2F3E46',
      pointBorderColor:'#FFFFFF',pointBorderWidth:2,fill:false}
  ];
  const last=datasets[0].data.length-1;
  return new Chart(document.getElementById('segChart-'+kind),{
    type:'line',
    data:{datasets},
    options:{
      responsive:true,maintainAspectRatio:false,animation:{duration:250},
      layout:{padding:{right:30,top:18}},
      interaction:{mode:'nearest',intersect:false},
      scales:{
        x:{type:'linear',min:lo,max:hi,title:{display:true,text:'Edad (años)',color:'#6B7B72',font:{size:11}},
          ticks:{stepSize:0.5,color:'#6B7B72',font:{size:11},callback:v=>segFmt(v)},grid:{color:'#EFF2EE'}},
        y:{title:{display:true,text:`${label} (${unit})`,color:'#6B7B72',font:{size:11}},
          ticks:{color:'#6B7B72',font:{size:11}},grid:{color:'#EFF2EE'}}
      },
      plugins:{
        legend:{display:false},
        tooltip:{
          filter:it=>!!it.dataset._player,displayColors:false,backgroundColor:'#2F3E46',padding:10,
          titleFont:{family:'Inter',size:12,weight:'600'},bodyFont:{family:'Inter',size:12},
          callbacks:{
            title:its=>its[0]?segFmtDate(its[0].raw.date):'',
            label:it=>[`Edad: ${segFmt(it.raw.x)} años`,`${label}: ${segFmt(it.raw.y)} ${unit}`+(it.raw.pct!=null?` · P${Math.round(it.raw.pct)}`:'')]
          }
        },
        datalabels:{
          display:ctx=>ctx.dataset._player||(ctx.dataset._ref&&ctx.dataIndex===last),
          formatter:(v,ctx)=>ctx.dataset._player?segFmt(v.y):'P'+ctx.dataset._ref,
          align:ctx=>ctx.dataset._player?'top':'right',
          anchor:'center',offset:ctx=>ctx.dataset._player?6:2,clamp:true,
          color:ctx=>ctx.dataset._player?'#2F3E46':'#9FACA3',
          font:ctx=>({family:'Inter',size:ctx.dataset._player?11:9.5,weight:ctx.dataset._player?'600':'500'})
        }
      }
    }
  });
}

// ═══════════════════════════════════════════
// BIENVENIDA (primera visita). Se recuerda en este navegador.
// ═══════════════════════════════════════════
const GUIA_KEY='riestra_bienvenida_v1';
function guiaLeer(){try{return localStorage.getItem(GUIA_KEY);}catch(e){return null;}}
function guiaGuardar(v){try{localStorage.setItem(GUIA_KEY,v);}catch(e){}}
function bienvenidaInicio(){ if(!guiaLeer()) abrirGuia('pregunta'); }
function cerrarGuia(){ document.getElementById('guiaOverlay')?.remove(); }
function abrirGuia(paso){
  cerrarGuia();
  const ov=document.createElement('div'); ov.id='guiaOverlay'; ov.className='guia-overlay';
  ov.innerHTML = paso==='pregunta' ? `
    <div class="guia-card" role="dialog" aria-modal="true" aria-labelledby="guiaT">
      <div class="guia-eyebrow">Bienvenido</div>
      <h3 id="guiaT">¿Es la primera vez que entrás al portal?</h3>
      <p class="guia-p">Si querés, te mostramos en un vistazo dónde está cada cosa.</p>
      <div class="guia-actions">
        <button type="button" class="guia-btn primary" onclick="abrirGuia('guia')">Sí, mostrame</button>
        <button type="button" class="guia-btn" onclick="guiaGuardar('omitida');cerrarGuia()">No</button>
      </div>
    </div>` : `
    <div class="guia-card" role="dialog" aria-modal="true" aria-labelledby="guiaT">
      <div class="guia-eyebrow">Un vistazo rápido</div>
      <h3 id="guiaT">Qué vas a encontrar</h3>
      <dl class="guia-list">
        <div><dt>Inicio</dt><dd>El resumen del plantel, siempre al día.</dd></div>
        <div><dt>Seguimiento</dt><dd>Buscá un jugador y mirá su peso y talla sobre las curvas de percentilos, o revisá la categoría entera.</dd></div>
        <div><dt>Categorías</dt><dd>Arriba, los informes y planillas. Abajo, los gráficos del grupo.</dd></div>
      </dl>
      <div class="guia-colors">${['dentro','vigilar','encima','debajo'].map(k=>`<span><i style="background:${ZONA[k].color}"></i>${ZONA[k].label}</span>`).join('')}</div>
      <div class="guia-actions"><button type="button" class="guia-btn primary" onclick="guiaGuardar('vista');cerrarGuia()">Entendido</button></div>
      <div class="guia-foot">Podés volver a verlo con el botón “Guía”, arriba a la derecha.</div>
    </div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov){ guiaGuardar(guiaLeer()||'omitida'); cerrarGuia(); } });
  document.body.appendChild(ov);
  ov.querySelector('.guia-btn')?.focus();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('guiaOverlay')){ guiaGuardar(guiaLeer()||'omitida'); cerrarGuia(); } });

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function setViewer(html){
  const v=document.getElementById('viewerArea');
  if(v){v.innerHTML=`<div class="viewer-wrap"><div class="viewer-bar"><button class="viewer-close" onclick="closeViewer()">Cerrar ✕</button></div>${html}</div>`;}
  else{document.getElementById('main').innerHTML=html;}
}
function showViewerError(msg){
  setViewer(`<div class="error-card"><strong>No se pudo cargar el archivo.</strong><br>${msg}</div>`);
}
