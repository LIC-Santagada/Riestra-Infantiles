// PLIEGUES (Σ6) por categoría
// ═══════════════════════════════════════════
const PL_UMBRAL=3; // mm: cambios menores se consideran "sin cambios" (margen de error de la medición)
const PL_ZONAS=[{k:'Óptimo',z:'dentro'},{k:'Aceptable',z:'vigilar'},{k:'Exceso',z:'encima'}];
function plZona(v,c){ return !c||v==null?null:v<=c.opt?'Óptimo':v<=c.acc?'Aceptable':'Exceso'; }
function plChip(v,c){
  const k=plZona(v,c); if(!k) return '<span class="muted">—</span>';
  const z=ZONA[PL_ZONAS.find(x=>x.k===k).z];
  return `<span class="pct-chip" style="background:${z.soft};color:${z.ink}">${k}</span>`;
}
function plFmtDelta(d){ return d==null?'—':(d>0?'+':d<0?'−':'')+segFmt(Math.abs(d)); }

// Agrupa las filas en sesiones: por la etiqueta de la columna "Sesión"; si falta, por fechas cercanas (45 días)
function plSesiones(players){
  const filas=players.flatMap(p=>p.pls.map(r=>({...r,key:p.key})));
  const sinEt=[...new Set(filas.filter(r=>!r.ses&&r.date).map(r=>+r.date))].sort((a,b)=>a-b), grupos=[];
  sinEt.forEach(d=>{const u=grupos[grupos.length-1]; if(u&&d-u.hasta<=45*864e5) u.hasta=d; else grupos.push({desde:d,hasta:d});});
  filas.forEach(r=>{
    if(r.ses) return;
    if(!r.date){ r.ses='Sin fecha'; return; }
    const g=grupos.find(g=>+r.date>=g.desde&&+r.date<=g.hasta), f=new Date(g.desde);
    r.ses=MESES[f.getMonth()]+' '+f.getFullYear();
  });
  const ses=new Map();
  filas.forEach(r=>{
    const s=ses.get(r.ses)||ses.set(r.ses,{label:r.ses,fecha:null,idx:Infinity,val:{}}).get(r.ses);
    if(r.date&&(!s.fecha||r.date<s.fecha)) s.fecha=r.date;
    s.idx=Math.min(s.idx,r.i);
    if(!(r.key in s.val)||r.i>s.val[r.key].i) s.val[r.key]={v:r.val,i:r.i}; // si hay dos en la misma sesión, vale la última fila
  });
  const out=[...ses.values()];
  const todasConFecha=out.every(s=>s.fecha);
  out.sort((a,b)=>todasConFecha?a.fecha-b.fecha:a.idx-b.idx);
  out.forEach(s=>{Object.keys(s.val).forEach(k=>s.val[k]=s.val[k].v);
    const vs=Object.values(s.val); s.n=vs.length; s.prom=vs.reduce((a,b)=>a+b,0)/vs.length;
    s.min=Math.min(...vs); s.max=Math.max(...vs);});
  return out;
}

function plRender(catId,data){
  const box=document.getElementById('catPliegues'); if(!box||!data) return;
  const jug=(data.all||[]).filter(p=>p.cat===catId&&p.pls.length);

  if(!ses.length){ box.innerHTML='<div class="seg-empty">No hay pliegues cargados para esta categoría.</div>'; return; }
  const s0=ses[0], sN=ses[ses.length-1], varias=ses.length>1;
  const nombre=k=>(jug.find(p=>p.key===k)||{}).name||k;
  // Mismos jugadores en la primera y la última medición
  const co=varias?Object.keys(s0.val).filter(k=>k in sN.val):[];
  const deltas=co.map(k=>sN.val[k]-s0.val[k]);
  const dProm=deltas.length?deltas.reduce((a,b)=>a+b,0)/deltas.length:null;
  const bajaron=deltas.filter(d=>d<=-PL_UMBRAL).length, subieron=deltas.filter(d=>d>=PL_UMBRAL).length;
  const pctZ=(s,k)=>{const vs=Object.values(s.val); return vs.length?Math.round(vs.filter(v=>plZona(v,c)===k).length/vs.length*100):0;};
  const cls=(a,b,menosEsMejor)=>a===b?'':(b<a)===menosEsMejor?'good':'warn';
  const pl=(x,u,v)=>x===1?u:v;

  const cards=[
    `<div class="stat-card"><div class="stat-card-label">Promedio Σ6 del plantel</div>

      ${varias?`<td class="num">${f.d==null?'<span class="muted">—</span>':plFmtDelta(f.d)}</td>`:''}
      ${c?`<td>${plChip(f.ult,c)}</td>`:''}</tr>`).join('');

  box.innerHTML=`
    <div class="stat-cards-grid">${cards.join('')}</div>
    ${conc?`<div class="inf-conclusion">${conc}</div>`:''}

    <div class="chart-card-full">
      <div class="chart-card-title">Pliegues de cada jugador</div>
      <div class="chart-card-subtitle">Suma de 6 pliegues (mm). Cada punto es una medición; ordenados de mayor a menor según la última. Tocá un nombre para ver su ficha.</div>
      <div class="chart-card-legend">${leyenda}</div>
      <div class="pl-plot">
        <div class="pl-row pl-axis"><span></span><div class="pl-ticks">${ticks.map((v,i)=>`<span class="${i%2?'pl-odd':''}" style="left:${X(v)}">${v}</span>`).join('')}</div><span class="pl-val muted">Últ. · cambio</span></div>
        ${filasHtml}
      </div>
    </div>

    <div class="chart-card-full">
      <div class="chart-card-title">Resumen por medición</div>
      <div class="chart-card-subtitle">Todos los jugadores medidos en cada fecha</div>
      <div class="table-card seg-table"><table>

          <tr><td>Rango (mm)</td>${ses.map(s=>`<td class="num">${segFmt(s.min)} – ${segFmt(s.max)}</td>`).join('')}</tr>
          ${c?PL_ZONAS.map(z=>`<tr><td><span class="legend-dot" style="display:inline-block;background:${ZONA[z.z].color};margin-right:8px"></span>${z.k}</td>
            ${ses.map(s=>{const n=Object.values(s.val).filter(v=>plZona(v,c)===z.k).length;return `<td class="num">${n} <span class="muted">(${Math.round(n/s.n*100)}%)</span></td>`;}).join('')}</tr>`).join(''):''}
          <tr class="inf-total"><td>Jugadores medidos</td>${ses.map(s=>`<td class="num">${s.n}</td>`).join('')}</tr>
        </tbody></table></div>
    </div>

    <div class="chart-card-full">
      <div class="chart-card-title">Valores por jugador</div>
      <div class="chart-card-subtitle">Σ6 pliegues en mm${varias?'; el cambio compara la primera y la última medición de cada jugador':''}</div>
      <div class="table-card seg-table"><table>
        <thead><tr><th>Jugador</th>${ses.map(s=>`<th class="num">${segEsc(s.label)}</th>`).join('')}${varias?'<th class="num">Cambio</th>':''}${c?'<th>Zona actual</th>':''}</tr></thead>
        <tbody>${tabla}
          <tr class="inf-total"><td>Promedio del plantel</td>${ses.map(s=>`<td class="num">${segFmt(s.prom)}</td>`).join('')}${varias?`<td class="num">${co.length?plFmtDelta(dProm):'—'}</td>`:''}${c?'<td></td>':''}</tr>
        </tbody></table></div>
    </div>

    <div class="seg-ref-note">${c?`Zonas de la categoría ${segEsc(catId)} según la hoja «Criterios pliegues» de la planilla: óptimo hasta ${segFmt(c.opt,0)} mm, aceptable hasta ${segFmt(c.acc,0)} mm, exceso por encima.`:'Esta categoría no tiene criterios cargados en la hoja «Criterios pliegues», por eso no se clasifica por zona.'}
      Cambios menores a ${PL_UMBRAL} mm se consideran dentro del margen de error de la medición.
      Los promedios de cada fecha incluyen sólo a los jugadores medidos ese día (los ausentes no cuentan como cero).</div>`;
  box.querySelectorAll('.inf-name').forEach(b=>b.addEventListener('click',()=>{ segCurrent=b.dataset.key; segCatFilter=catId; showSeguimiento(); }));
}

// ═══════════════════════════════════════════
// PASAJE A NOVENA (Cat. 2013 → Novena 2027)
// Todo se calcula desde la planilla; River Plate 2022 son valores de referencia fijos.
// ═══════════════════════════════════════════
const PASAJE={
  cat:'2013', titulo:'Pasaje a Novena', destino:'Novena 2027',
  corteX:-0.5, // años respecto del pico que separan "todavía no llegó" de "ya en su pico"
  river:{ // Pudelka M., tesis de Maestría en Nutrición Humana (UNLP, 2026), datos 2022
    r10:{nombre:'River 10ª (≈13 años)',talla:[164.8,8.7],peso:[54.7,9.3]},
    r9:{nombre:'River 9ª (≈14 años)',talla:[170.9,8.4],peso:[63.0,9.0]},
    estado:{'Adecuado':82,'Sobrepeso':17,'Obesidad':2}, // todas las categorías 2022; bajo peso no informado
    pos9:{ARQ:{n:'Arqueros',talla:[180.3,4.5],peso:[77.5,3.8]},DEF:{n:'Defensores',talla:[170.3,8.9],peso:[63.2,10.0]},
          VOL:{n:'Volantes',talla:[168.2,7.4],peso:[58.6,7.3]},DEL:{n:'Delanteros',talla:[171.4,8.4],peso:[62.4,4.7]}}
  }
};
const CUAD={
  A:{t:'Grandes y todavía no llegaron a su pico',c:'#2F6F8F',lect:'Ya están en la mitad alta de talla y todavía no llegaron a su pico de crecimiento: es el grupo con mayor proyección física. Si además rinden técnicamente, son los candidatos más sólidos.'},
  B:{t:'Grandes porque ya maduraron',c:'#AF5234',lect:'Hoy ganan duelos por tamaño y potencia porque maduraron antes. Los compañeros los van a alcanzar: necesitan desarrollar recursos técnicos y no depender solo de lo físico.'},
  C:{t:'Chicos hoy, todavía no llegaron a su pico',c:'#84A98C',lect:'Más chicos de tamaño hoy, con el pico de crecimiento por delante. Sus desventajas físicas actuales son en gran parte cuestión de tiempo: evaluarlos por técnica y lectura de juego.'},
  D:{t:'Chicos y ya en su pico',c:'#9FACA3',lect:'Más chicos y ya en su pico: el grupo con menos margen de crecimiento.'}
};
const MOM={'Antes del estirón':'#4A8CC1','En el estirón':'#CA933E','Después del estirón':'#7E3520'};
const SEM={Verde:{c:'#167F5C',t:'Bien encaminado'},Amarillo:{c:'#CA933E',t:'Seguir de cerca'},Rojo:{c:'#AF5234',t:'Prioridad'},Gris:{c:'#9FACA3',t:'Sin dato reciente'}};
let pasCharts=[], pasData=null, pasFiltro={sem:'',mom:'',cuad:''};

function pasMean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function pasSd(a){const m=pasMean(a);return a.length>1?Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1)):null;}
function pasMedian(a){const b=[...a].sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):null;}
function pasMirwald(age,h,sh,w){const ll=h-sh;return -9.236+0.0002708*ll*sh-0.001663*age*ll+0.007216*age*sh+0.02292*(w/h*100);}
function pasSigno(v,d=1){return v==null?'—':(v>0?'+':v<0?'−':'±')+segFmt(Math.abs(v),d);}
function pasCorto(n){const p=n.replace(/\s*\(\d{4}\)$/,'').split(' ');return p.length>1?p[0]+' '+p[p.length-1][0]+'.':n;}

// Trayectoria de pliegues + estado (mismas reglas que el informe impreso)
function pasTrayectoria(pls,ests,crit){
  const NIV={'Bajo peso':0,'Adecuado':1,'Sobrepeso':2,'Obesidad':3}, dist=e=>Math.abs(NIV[e]-1);
  if(pls.length<2&&ests.length<2) return 'Una sola medición';
  const d=pls.length>=2?pls[pls.length-1]-pls[0]:0;
  let zig=false;
  for(let i=1;i<pls.length-1;i++){const a=pls[i]-pls[i-1],b=pls[i+1]-pls[i]; if(a*b<0&&Math.min(Math.abs(a),Math.abs(b))>=8) zig=true;}
  const zl=pls.length?plZona(pls[pls.length-1],crit):null, el=ests.length?ests[ests.length-1]:null;
  const dEs=ests.length>=2?dist(ests[ests.length-1])-dist(ests[0]):0;
  const bien=(zl==null||zl==='Óptimo')&&(el==null||el==='Adecuado');
  if(zig) return 'Variable';
  if(dEs>0||(d>=PL_UMBRAL&&zl&&zl!=='Óptimo')||d>=8) return 'Empeoró';
  if(dEs<0||d<=-PL_UMBRAL) return 'Mejorando';
  return bien?'Constante y bien':'Estancado';
}

function pasCalcular(catId,data){
  const ref=data.ref||{}, crit=(data.crit||{})[catId]||null;
  const jug=data.list.filter(p=>p.cat===catId);
  // sesiones ordenadas por fecha (etiqueta de la columna Sesión)
  const fe={}; jug.forEach(p=>p.meds.forEach(m=>{ if(m.ses&&m.date&&(!fe[m.ses]||m.date<fe[m.ses])) fe[m.ses]=m.date; }));
  const ses=Object.keys(fe).sort((a,b)=>fe[a]-fe[b]); const L=ses[ses.length-1], F=ses[0];
  const rows=jug.map(p=>{
    const by={}; p.meds.forEach(m=>{ if(m.ses) by[m.ses]=m; });
    const o=by[L]||null, r={p,key:p.key,name:p.name,by,o,dob:p.dob,extra:p.extra||{}};
    r.tri=p.dob?Math.floor(p.dob.getMonth()/3)+1:null;
    const serie=k=>ses.map(s=>by[s]?.[k]??null);
    r.tallas=serie('talla'); r.pesos=serie('peso'); r.pls=serie('pl');
    const ests=[];
    ses.forEach(s=>{const m=by[s]; if(m&&m.peso&&m.talla&&p.dob){const a=segAge(p.dob,m.date);const pc=segPercentile(ref.imc?.varones,a,m.peso/((m.talla/100)**2)); if(pc!=null) ests.push(infEstado(pc));}});
    r.evol=pasTrayectoria(r.pls.filter(v=>v!=null),ests,crit);
    // velocidad de crecimiento
    const ts=ses.map(s=>by[s]).filter(m=>m&&m.talla&&m.date);
    if(ts.length>=2){const yrs=(ts[ts.length-1].date-ts[0].date)/MS_YEAR; if(yrs>0.2){r.vel=(ts[ts.length-1].talla-ts[0].talla)/yrs; r.meses=yrs*12;}}
    if(o&&o.peso&&o.talla){
      r.edad=segAge(p.dob,o.date); r.imc=o.peso/((o.talla/100)**2);
      const pc=r.edad!=null?segPercentile(ref.imc?.varones,r.edad,r.imc):null; r.estado=pc!=null?infEstado(pc):null;
      r.pctT=r.edad!=null?segPercentile(ref.talla?.varones,r.edad,o.talla):null;
      r.zona=plZona(o.pl,crit);
      if(o.sh&&r.edad!=null){r.mo=pasMirwald(r.edad,o.talla,o.sh,o.peso); r.phv=r.edad-r.mo;
        r.mom=r.mo<-1?'Antes del estirón':r.mo<=1?'En el estirón':'Después del estirón';}
      if(o.pt&&o.pp){r.grasa=0.735*(o.pt+o.pp)+1.0; r.mlg=o.peso*(1-r.grasa/100); r.imlg=r.mlg/((o.talla/100)**2);}
      const f=ses.map(s=>by[s]).find(m=>m&&m.pt&&m.pp&&m.peso);
      if(f&&r.mlg!=null&&f!==o){const g0=0.735*(f.pt+f.pp)+1.0,m0=f.peso*(1-g0/100); r.dMlg=r.mlg-m0; r.dMg=(o.peso-r.mlg)-(f.peso-m0); r.dPeso=o.peso-f.peso;}
      const RV=PASAJE.river; r.z9t=(o.talla-RV.r9.talla[0])/RV.r9.talla[1]; r.z9p=(o.peso-RV.r9.peso[0])/RV.r9.peso[1];
      r.z10t=(o.talla-RV.r10.talla[0])/RV.r10.talla[1];
      r.vsNov=r.z9t>=0?'Ya en la media de Novena':r.z9t>=-1?'Dentro de 1 DE':'Más de 1 DE por debajo';
    }
    const plv=r.pls.filter(v=>v!=null); r.dPl=plv.length>=2?plv[plv.length-1]-plv[0]:null;
    return r;
  });
  const med=rows.filter(r=>r.o&&r.o.talla);
  const tl=med.map(r=>r.o.talla), mt=pasMean(tl), sdt=pasSd(tl);
  const il=med.filter(r=>r.imlg!=null).map(r=>r.imlg), mi=pasMean(il), sdi=pasSd(il);
  rows.forEach(r=>{
    if(!r.o||!r.o.talla){r.sem='Gris'; return;}
    r.zt=(r.o.talla-mt)/sdt; if(r.imlg!=null) r.zi=(r.imlg-mi)/sdi;
    if(r.mo!=null) r.cuad=(r.zt>=0?(r.mo>=PASAJE.corteX?'B':'A'):(r.mo>=PASAJE.corteX?'D':'C'));
    r.sem=(r.estado==='Obesidad'||r.zona==='Exceso'||(r.evol==='Empeoró'&&r.estado==='Sobrepeso'))?'Rojo':
          (r.estado==='Adecuado'&&r.zona==='Óptimo'&&['Constante y bien','Mejorando'].includes(r.evol))?'Verde':'Amarillo';
    r.badges=[];
    if(r.cuad==='A'&&r.zona==='Óptimo'&&['Constante y bien','Mejorando'].includes(r.evol)) r.badges.push(['estrella','Proyección + grasa óptima + buena evolución']);
    if(r.mo!=null&&r.mo<PASAJE.corteX&&r.zona==='Óptimo'&&r.zi!=null&&r.zi>=0.2) r.badges.push(['robusto','Robusto para su madurez']);
    if(r.mo!=null&&r.mo<-1&&r.pctT!=null&&r.pctT<50) r.badges.push(['proteger','Proteger: madura tarde']);
  });
  return {catId,ses,F,L,fe,rows,med,mt,sdt,crit,ref};
}

function pasCumple(r){
  const f=pasFiltro;
  return (!f.sem||r.sem===f.sem)&&(!f.mom||r.mom===f.mom)&&(!f.cuad||r.cuad===f.cuad);
}
const BADGE_ICO={estrella:'★',robusto:'◆',proteger:'◇'};
function pasBadges(r){return (r.badges||[]).map(([k,t])=>`<span class="pas-badge pas-b-${k}" title="${segEsc(t)}">${BADGE_ICO[k]} ${segEsc(t)}</span>`).join('');}
function pasChipSem(s){return `<span class="pas-sem"><span class="dot" style="background:${SEM[s].c}"></span>${SEM[s].t}</span>`;}

function pasInit(catId,data){ pasData=pasCalcular(catId,data); pasFiltro={sem:'',mom:'',cuad:''}; pasRender(); }

function pasSetFiltro(k,v){ pasFiltro[k]=pasFiltro[k]===v?'':v; pasRender(true); }

function pasRender(soloFiltro){
  const box=document.getElementById('catPasaje'); if(!box||!pasData) return;
  pasCharts.forEach(c=>c.destroy()); pasCharts=[];
  const D=pasData, R=D.rows, M=D.med, RV=PASAJE.river, L=D.L, F=D.F, c=D.crit;
  const n=M.length, tot=R.length, aus=R.filter(r=>!r.o).map(r=>r.name);
  const cnt=(arr,f)=>arr.filter(f).length, pc=(a,b)=>b?Math.round(a/b*100):0;
  const tF=pasMean(R.map(r=>r.by[F]?.talla).filter(Boolean)), pF=pasMean(R.map(r=>r.by[F]?.peso).filter(Boolean));
  const tL=D.mt, pL=pasMean(M.map(r=>r.o.peso)), sdp=pasSd(M.map(r=>r.o.peso));

  const nEn=cnt(M,r=>r.mom==='En el estirón'), nAntes=cnt(M,r=>r.mom==='Antes del estirón'), nDesp=cnt(M,r=>r.mom==='Después del estirón');
  const phvs=M.filter(r=>r.phv!=null).map(r=>r.phv), phvM=pasMean(phvs);
  const nOpt=cnt(M,r=>r.zona==='Óptimo'), nExc=cnt(M,r=>r.zona==='Exceso');
  const nSem=k=>cnt(R,r=>r.sem===k);
  const est={}; ['Bajo peso','Adecuado','Sobrepeso','Obesidad'].forEach(k=>est[k]=cnt(M,r=>r.estado===k)); const nEst=M.filter(r=>r.estado).length;
  const cuadN=k=>cnt(M,r=>r.cuad===k);
  const vis=R.filter(pasCumple), visM=M.filter(pasCumple);
  const filtrando=pasFiltro.sem||pasFiltro.mom||pasFiltro.cuad;
  const qm=(q,a)=>`<div class="pas-que"><b>Qué muestra.</b> ${q}</div>`;

  // ── Filtros ──
  const chipF=(k,v,t,col)=>`<button type="button" class="pas-fchip${pasFiltro[k]===v?' on':''}" onclick="pasSetFiltro('${k}','${v}')">${col?`<span class="dot" style="background:${col}"></span>`:''}${t}</button>`;
  const filtros=`<div class="pas-filtros" role="group" aria-label="Filtros">

    <div class="pas-fcount">${filtrando?`Mostrando <b>${visM.length}</b> de ${n} · <button type="button" class="pas-flimpiar" onclick="pasFiltro={sem:'',mom:'',cuad:''};pasRender(true)">Quitar filtros</button>`:`${n} jugadores medidos en ${L}`}</div>
  </div>`;

  // ── KPIs ──
  const kpi=(l,v,s,cls='')=>`<div class="stat-card"><div class="stat-card-label">${l}</div><div class="stat-card-value ${cls}">${v}</div><div class="stat-card-sub">${s}</div></div>`;
  const kpis=[
    kpi(`Jugadores medidos (${L.split(' ')[0].toLowerCase()})`,`${n} <span class="stat-unit">de ${tot}</span>`,aus.length?`${aus.length} ausentes: ${aus.map(pasCorto).join(', ')}`:'todos medidos'),
    kpi('Talla media',`${segFmt(tL)}<span class="stat-unit"> cm</span>`,`${segFmt(tF)} cm en ${F} · grupos no idénticos`),
    kpi('Peso medio',`${segFmt(pL)}<span class="stat-unit"> kg</span>`,`${segFmt(pF)} kg en ${F}`),
    kpi('Crecimiento típico',`${segFmt(pasMedian(vels))}<span class="stat-unit"> cm/año</span>`,'mediana · referencia: 5–6 antes del estirón, 8–10 en pleno estirón'),
    kpi('En el estirón',`${nEn} <span class="stat-unit">de ${n}</span>`,`${nAntes} todavía no llegaron${nDesp?`, ${nDesp} ya lo pasaron`:''}`),

  // ── B · Mapa de proyección ──
  const enB=M.filter(r=>r.cuad==='B'), rojos=R.filter(r=>r.sem==='Rojo'), rojosB=rojos.filter(r=>r.cuad==='B');

      <p>${CUAD[q].lect}</p><div class="pas-names">${js.length?js.map(r=>`<button type="button" class="pas-nm pas-open${pasCumple(r)?'':' dim'}" data-key="${segEsc(r.key)}"><span class="dot" style="background:${SEM[r.sem].c}"></span>${segEsc(pasCorto(r.name))}</button>`).join(''):'<span class="muted">Ningún jugador</span>'}</div></div>`;}).join('');
  const destacados=[['estrella','Proyección física + grasa óptima + buena evolución','Cuadrante A, pliegues en zona óptima y evolución constante o en mejora.'],

    .map(([k,t,d])=>{const js=M.filter(r=>r.badges.some(b=>b[0]===k)); return `<div class="pas-dest"><div class="pas-dest-h"><span class="pas-badge pas-b-${k}">${BADGE_ICO[k]}</span> ${t} <span class="muted">· ${js.length}</span></div><div class="pas-dest-d">${d}</div><div class="pas-names">${js.map(r=>`<button type="button" class="pas-nm pas-open" data-key="${segEsc(r.key)}">${segEsc(pasCorto(r.name))}</button>`).join('')||'<span class="muted">Ninguno</span>'}</div></div>`;}).join('');

  // ── River ──
  const novDe=lista(novena.map(r=>pasCorto(r.name)));
  const tablaRiver=`<table><thead><tr><th></th><th class="num">Talla (cm)</th><th class="num">Peso (kg)</th></tr></thead><tbody>
    <tr><td><b>Riestra ${D.catId} (${L}, n=${n})</b></td><td class="num"><b>${segFmt(tL)} ± ${segFmt(D.sdt)}</b></td><td class="num"><b>${segFmt(pL)} ± ${segFmt(sdp)}</b></td></tr>
    <tr><td>${RV.r10.nombre}</td><td class="num">${segFmt(RV.r10.talla[0])} ± ${segFmt(RV.r10.talla[1])}</td><td class="num">${segFmt(RV.r10.peso[0])} ± ${segFmt(RV.r10.peso[1])}</td></tr>
    <tr><td>${RV.r9.nombre}</td><td class="num">${segFmt(RV.r9.talla[0])} ± ${segFmt(RV.r9.talla[1])}</td><td class="num">${segFmt(RV.r9.peso[0])} ± ${segFmt(RV.r9.peso[1])}</td></tr></tbody></table>`;
  const barraEst=(cu,tot,nombre,sub,crudo)=>`<div class="vg-row"><div class="vg-row-label">${nombre}<small>${sub}</small></div><div class="vg-bar">${ESTADOS.filter(e=>cu[e.k]).map(e=>{const v=cu[e.k]/tot*100, lab=crudo?cu[e.k]:Math.round(v);return `<span style="width:${v}%;background:${ZONA[e.z].color}${e.k==='Sobrepeso'?';color:#3D2A08':''}" title="${e.k}: ${lab}%">${v>=7?lab+'%':''}</span>`;}).join('')}</div></div>`;
  const riverEst={...RV.estado}; const riverTot=Object.values(riverEst).reduce((a,b)=>a+b,0);

  // ── Masa magra ──
  const conMlg=R.filter(r=>r.dMlg!=null).sort((a,b)=>b.dMlg-a.dMlg);

  const pocos=conMlg.filter(r=>r.dMlg<1.5).map(r=>`${pasCorto(r.name)} ${pasSigno(r.dMlg)}${r.meses&&r.meses<6?' (4 meses)':''}`);

  // ── Grasa ──
  const conPl=R.filter(r=>r.dPl!=null);
  const coFL=R.filter(r=>r.by[F]?.pl&&r.by[L]?.pl), dFL=pasMean(coFL.map(r=>r.by[L].pl-r.by[F].pl));
  const bajaron=[...conPl].sort((a,b)=>a.dPl-b.dPl).filter(r=>r.dPl<=-PL_UMBRAL).slice(0,3), subieron=[...conPl].sort((a,b)=>b.dPl-a.dPl).filter(r=>r.dPl>=PL_UMBRAL).slice(0,2);

    return `<div class="pas-kcol"><div class="pas-kh" style="border-top-color:${ZONA[z].color}">${k}<span>${js.length}</span></div>${js.map(r=>`<button type="button" class="pas-kcard pas-open${pasCumple(r)?'':' dim'}" data-key="${segEsc(r.key)}"><b>${segEsc(pasCorto(r.name))}</b><small>Σ6 ${r.pls.filter(v=>v!=null).map(v=>Math.round(v)).join(' → ')||'—'}</small></button>`).join('')}</div>`;}).join('');
  const una=R.filter(r=>r.evol==='Una sola medición').map(r=>pasCorto(r.name));

  // ── Semáforo (tabla) ──
  const ordenS={Rojo:0,Amarillo:1,Verde:2,Gris:3};
  const filasSem=vis.slice().sort((a,b)=>ordenS[a.sem]-ordenS[b.sem]||a.name.localeCompare(b.name,'es')).map(r=>`<tr>
    <td style="white-space:nowrap"><span class="dot" style="background:${SEM[r.sem].c}"></span>${nombreBtn(r)}</td>

    <td>${r.mom?`<span class="dot" style="background:${MOM[r.mom]}"></span>${r.mom}`:'<span class="muted">—</span>'}</td>

  box.innerHTML=`
  <div class="pas-head">
    <div class="pas-kicker">Categoría ${D.catId} → ${PASAJE.destino}</div>

    <div class="pas-lema">Más desarrollado hoy no es lo mismo que mejor jugador.<span>La antropometría da contexto físico; no mide técnica, inteligencia de juego ni actitud.</span></div>

  ${filtros}

    ${qm(`Cada punto es un jugador. Hacia la derecha, los que ya están en su pico de crecimiento o cerca; hacia la izquierda, a los que todavía les falta. Hacia arriba, los más altos del plantel. El color es el semáforo y el tamaño, la masa magra para su talla.`)}

    <div class="pas-two">
      <div class="chart-card-full"><div class="chart-card-title">Talla y peso promedio</div><div class="chart-card-subtitle">Media ± 1 desvío estándar</div><div style="height:260px"><canvas id="pasRiverBar"></canvas></div>${tablaRiver}</div>
      <div class="chart-card-full"><div class="chart-card-title">Cada jugador frente a River</div><div class="chart-card-subtitle">Rectángulos: media ± 1 DE de River 10ª y 9ª. Color: momento madurativo.</div><div style="height:330px"><canvas id="pasRiverScatter"></canvas></div>
        <div class="chart-card-legend">${Object.entries(MOM).filter(([k])=>cnt(M,r=>r.mom===k)).map(([k,v])=>`<div class="evolucion-legend-item"><span class="evolucion-legend-dot" style="background:${v}"></span>${k}</div>`).join('')}</div></div>
    </div>
    <div class="inf-conclusion">Frente a chicos de su misma edad de una inferior de élite (River 10ª), la ${D.catId} está casi a la par en promedio: ${pasSigno(tL-RV.r10.talla[0],0)} cm de talla y ${pasSigno(pL-RV.r10.peso[0],0)} kg de peso. La brecha grande aparece contra la Novena de River: ${pasSigno(tL-RV.r9.talla[0],0)} cm y ${pasSigno(pL-RV.r9.peso[0],0)} kg. Gran parte de esa diferencia es tiempo: ${nAntes} chicos todavía no llegaron al estirón. Ya tienen la talla media de esa Novena: ${novDe||'ninguno'}.</div>
    <div class="pas-two">

        <div class="vg-rows" style="margin-top:12px">${barraEst(est,nEst,`Riestra ${D.catId}`,`${L} · n=${nEst}`)}${barraEst(riverEst,riverTot,'River 2022','todas las categorías',true)}</div>

        <p class="pas-p">La diferencia más marcada no es el tamaño, es la grasa: ${pc(est['Obesidad'],nEst)}% de obesidad por IMC contra ${RV.estado['Obesidad']}% en River. Es lo que más rápido se puede corregir y la mejor forma de achicar la brecha física antes de Novena sin esperar al crecimiento.</p></div>
      <div class="chart-card-full pas-tesis"><div class="chart-card-title">Lo que dice la tesis y le sirve al técnico</div><ol>
        <li>En River, 10ª, 9ª y 8ª (13 a 15 años) son las divisiones donde más cambia el cuerpo: un <b>período crítico de especialización morfológica</b>. La ${D.catId} entra justo en esa ventana.</li>

    </div>
    ${qh(`Al arrancar Novena, en los duelos físicos van a estar en desventaja frente a rivales un año más maduros y más seleccionados. Es una comparación de tamaño contra chicos mayores: no mide calidad.`)}
  </section>

  <section class="pas-sec"><div class="pas-sec-n">3</div><h3 class="pas-sec-t">Masa magra: la aproximación a la "fuerza"</h3>

    <p class="seg-ref-note">Verde: peso adecuado + pliegues óptimos + evolución estable o en mejora. Rojo: obesidad, pliegues en exceso o empeoramiento con sobrepeso. Amarillo: el resto. <b>No es un criterio de selección deportiva.</b></p>

  <section class="pas-sec"><div class="pas-sec-n">8</div><h3 class="pas-sec-t">Recomendaciones para ${PASAJE.destino}</h3>
    <div class="pas-reco">
      <div><h4>Cuerpo técnico</h4><ul><li>Usar el mapa y el semáforo como contexto, no como filtro. Un chico de baja talla y maduración tardía puede estar entre los más altos en dos años.</li><li>Comparar a cada jugador con su propia evolución, no solo con el más desarrollado.</li><li>Considerar actividades agrupadas por maduración (<i>bio-banding</i>) en algunos juegos: los tardíos muestran técnica y los adelantados tienen un desafío real. Es un complemento, no un reemplazo de la categoría.</li></ul></div>
      <div><h4>Preparación física</h4><ul><li>Antes del estirón: técnica de carrera, coordinación, velocidad y fuerza con el propio peso.</li><li>En el estirón: sostener fuerza y movilidad, controlar volúmenes de impacto, no aumentar todo a la vez.</li><li>Cuadrante B en rojo: capacidad aeróbica y fuerza junto con la intervención nutricional.</li></ul></div>
      <div><h4>Nutrición y familias</h4><ul><li>Seguimiento individual de los ${rojos.length} en rojo: control de pliegues cada 6–8 semanas y revisión de hábitos con la familia.</li><li>Nadie de la categoría debe hacer dietas restrictivas: el objetivo es la calidad de lo que comen, no comer menos.</li>${R.filter(r=>r.estado==='Bajo peso').map(r=>`<li>${segEsc(r.name)}: asegurar energía suficiente (bajo peso).</li>`).join('')}</ul></div>
    </div>
    <div class="box-pasos"><b>Próximos pasos de medición</b><ol>
      <li><b>Posición</b> de cada jugador (las referencias cambian por puesto). Se carga en la hoja Jugadores de la planilla.</li>
      <li><b>Tests físicos</b> junto con la antropometría: salto (CMJ), sprint 10 y 30 m, Yo-Yo IR1.</li>
      <li><b>Perfil ISAK completo</b> (perímetros y diámetros) para los 5 componentes de Kerr y la comparación directa con River.</li>
      <li><b>Talla de los padres</b> para estimar la talla adulta (Khamis-Roche), más precisa que la ecuación actual.</li>
      <li><b>Referencia propia:</b> medir la Novena actual de Riestra (cat. 2012).</li>
      <li>Próxima medición: <b>marzo 2027</b>, mismo protocolo.</li></ol></div>
  </section>

  <details class="pas-met"><summary>Metodología y notas</summary>
    <ul>
      <li>Mediciones ISAK: talla, talla sentado, peso y 6 pliegues (tríceps, subescapular, supraespinal, abdominal, muslo frontal, pierna medial).</li>
      <li>Estado nutricional: IMC para la edad, OMS 2007 (bajo peso &lt;P3; adecuado P3–P85; sobrepeso P85–P97; obesidad ≥P97). Tamizaje, no diagnóstico. Percentil de talla: SAP (Lejarraga y col., 2009).</li>
      <li>Maduración: offset madurativo de Mirwald y col. (2002) con los datos de ${L}. La ecuación acerca a todos al promedio (a los tempranos les asigna un pico algo más tardío y a los tardíos uno algo más temprano), así que los extremos son conservadores. Margen ±0,5–1 año. Antes del estirón: offset &lt; −1; en el estirón: −1 a +1.</li>
      <li>Cuadrantes: corte vertical en ${segFmt(PASAJE.corteX)} años respecto del pico y horizontal en la talla promedio del plantel (z = 0).</li>
      <li>% grasa: Slaughter y col. (1988), %G = 0,735 × (tríceps + pierna) + 1,0. Masa libre de grasa = peso × (1 − %G/100). IMLG = MLG / talla². Error individual alto: sirve para seguir tendencias.</li>
      <li>Comparación con River: z = (valor − media de la división) / DE. 10ª ≈ 13 años y 9ª ≈ 14 años; Riestra fue medida a los ${segFmt(pasMean(M.filter(r=>r.edad!=null).map(r=>r.edad)))} años en promedio. Referencia: Pudelka M., tesis de Maestría en Nutrición Humana, UNLP, 2026 (dir. F. Holway); estudio de una sola institución, sin datos de maduración.</li>
      <li>Cambios de Σ6 menores a ${PL_UMBRAL} mm se consideran dentro del error de medición. Las celdas vacías de la planilla se muestran como "—", nunca como cero.</li>
    </ul></details>`;

function pasComentario(r){
  const out=[];
  if(r.sem==='Gris') return 'Ausente en la última medición';
  if(r.evol==='Una sola medición') out.push('una sola medición: sin evolución todavía');
  if(r.evol==='Variable') out.push('pliegues muy variables');
  else if(r.evol==='Empeoró') out.push(r.dPl!=null&&r.dPl>=PL_UMBRAL?'subió la grasa':'empeoró su categoría de peso');
  else if(r.evol==='Mejorando') out.push('viene mejorando');
  else if(r.evol==='Estancado') out.push('sin cambios fuera de la zona ideal');
  else if(r.evol==='Constante y bien') out.push('constante');
  if(r.estado==='Bajo peso') out.push('bajo peso: priorizar que coma suficiente');
  if(r.estado==='Sobrepeso'&&r.zona==='Óptimo') out.push('IMC alto con grasa óptima');
  if(r.vel!=null&&r.vel>=0&&r.vel<3) out.push('crecimiento lento, confirmar');
  r.badges.forEach(b=>out.push(b[1].toLowerCase()));
  const t=out.join('; '); return t.charAt(0).toUpperCase()+t.slice(1);
}

    pasCharts.push(new Chart(ph,{type:'scatter',plugins:[band],data:{datasets:[{data:pts,backgroundColor:pts.map(p=>alfa(MOM[p.r.mom],sel.has(p.key)?0.9:0.15)),pointRadius:5,pointHoverRadius:7}]},
      options:{...base,onClick:clickFicha,scales:{x:{min:12.3,max:16.2,ticks:{...tick,callback:v=>segFmt(v,1)},grid},y:{display:false,min:-0.8,max:0.8}},
        plugins:{legend:{display:false},datalabels:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw.r.name}: ${segFmt(ctx.raw.x)} años`}}}}}));
  }
  // 2d · trimestres
  const tr=document.getElementById('pasTri');
  if(tr){
    const v=[1,2,3,4].map(q=>D.rows.filter(r=>r.tri===q).length), esp=v.reduce((a,b)=>a+b,0)/4;
    const lin={id:'pasEsp',afterDatasetsDraw(ch){const {ctx,chartArea:a,scales:{y}}=ch; const yy=y.getPixelForValue(esp); ctx.save(); ctx.strokeStyle='#6B7B72'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(a.left,yy); ctx.lineTo(a.right,yy); ctx.stroke(); ctx.restore();}};
    pasCharts.push(new Chart(tr,{type:'bar',plugins:[lin],data:{labels:['Ene–Mar','Abr–Jun','Jul–Sep','Oct–Dic'],datasets:[{data:v,backgroundColor:['#354F52','#52796F','#84A98C','#A9C2B8'],barPercentage:.6}]},
      options:{...base,scales:{x:{ticks:tick,grid:{display:false}},y:{beginAtZero:true,grace:'15%',ticks:{...tick,precision:0},grid}},plugins:{legend:{display:false},tooltip:{enabled:false},datalabels:{anchor:'end',align:'top',font:{family:'Inter',size:11,weight:'700'},color:'#2F3E46'}}}}));
  }
  // 3 · masa magra
  const mg=document.getElementById('pasMlg');
  if(mg){
    const rs=D.rows.filter(r=>r.dMlg!=null).sort((a,b)=>b.dMlg-a.dMlg);
    pasCharts.push(new Chart(mg,{type:'bar',data:{labels:rs.map(r=>pasCorto(r.name)),datasets:[
      {label:'Masa magra',data:rs.map(r=>r.dMlg),backgroundColor:rs.map(r=>alfa('#167F5C',sel.has(r.key)?0.9:0.2)),stack:'s',key:rs.map(r=>r.key)},
      {label:'Masa grasa',data:rs.map(r=>r.dMg),backgroundColor:rs.map(r=>alfa('#AF5234',sel.has(r.key)?0.85:0.2)),stack:'s'}]},
      options:{...base,indexAxis:'y',onClick:(e,els)=>{if(els.length) pasFicha(rs[els[0].index].key);},
        scales:{x:{stacked:true,ticks:{...tick,callback:v=>(v>0?'+':'')+segFmt(v,0)},grid,title:{display:true,text:'kg ganados (o perdidos) en el año',color:'#6B7B72'}},y:{stacked:true,ticks:{...tick,autoSkip:false,font:{family:'Inter',size:10.5}},grid:{display:false}}},
        plugins:{legend:{position:'top',align:'start',labels:{font:{family:'Inter',size:11},boxWidth:12}},datalabels:{display:false},
          tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${pasSigno(ctx.raw)} kg`,afterBody:items=>{const r=rs[items[0].dataIndex];return [`Peso: ${pasSigno(r.dPeso)} kg`,`${r.meses?Math.round(r.meses)+' meses de seguimiento':''}`];}}}}}}));
  }
  // 4 · velocidad
  const ve=document.getElementById('pasVel');
  if(ve){
    const rs=D.rows.filter(r=>r.vel!=null).sort((a,b)=>b.vel-a.vel);
    const franja={id:'pasFranja',beforeDatasetsDraw(ch){const {ctx,chartArea:a,scales:{x}}=ch; ctx.save(); ctx.fillStyle='#EEF3F0'; const x0=x.getPixelForValue(5),x1=x.getPixelForValue(10); ctx.fillRect(x0,a.top,x1-x0,a.bottom-a.top); ctx.restore();}};
    const rayado=(()=>{const c=document.createElement('canvas');c.width=c.height=8;const g=c.getContext('2d');g.strokeStyle='#52796F';g.lineWidth=1.5;g.beginPath();g.moveTo(0,8);g.lineTo(8,0);g.stroke();return g.createPattern(c,'repeat');})();
    pasCharts.push(new Chart(ve,{type:'bar',plugins:[franja],data:{labels:rs.map(r=>pasCorto(r.name)),datasets:[{data:rs.map(r=>r.vel),
      backgroundColor:rs.map(r=>(r.vel<0||r.vel>12)?rayado:alfa('#52796F',sel.has(r.key)?0.9:0.2)),borderColor:'#52796F',borderWidth:rs.map(r=>(r.vel<0||r.vel>12)?1:0)}]},
      options:{...base,indexAxis:'y',onClick:(e,els)=>{if(els.length) pasFicha(rs[els[0].index].key);},
        scales:{x:{ticks:{...tick,callback:v=>segFmt(v,0)},grid,title:{display:true,text:'cm por año',color:'#6B7B72'}},y:{ticks:{...tick,autoSkip:false,font:{family:'Inter',size:10.5}},grid:{display:false}}},
        plugins:{legend:{display:false},datalabels:{anchor:'end',align:ctx=>ctx.raw<0?'start':'end',font:{family:'Inter',size:10},color:'#2F3E46',formatter:v=>segFmt(v,1)},
          tooltip:{callbacks:{label:ctx=>{const r=rs[ctx.dataIndex];return `${segFmt(r.vel)} cm/año · ${Math.round(r.meses)} meses de seguimiento`;}}}}}}));
  }
}

// ── Ficha individual ──
function pasSpark(vals,labels,zonas,unidad){
  const pts=vals.map((v,i)=>({v,i})).filter(p=>p.v!=null); if(!pts.length) return '<span class="muted">sin datos</span>';
  const W=170,H=56,pad=10, vs=pts.map(p=>p.v); let lo=Math.min(...vs),hi=Math.max(...vs);
  if(zonas){lo=Math.min(lo,zonas[0]-8);hi=Math.max(hi,zonas[1]+5);} if(hi-lo<2){lo-=1;hi+=1;}
  const X=i=>pad+(vals.length>1?i/(vals.length-1):0.5)*(W-2*pad), Y=v=>H-6-(v-lo)/(hi-lo)*(H-20);
  let bg=''; if(zonas){bg=`<rect x="0" y="${Y(zonas[0])}" width="${W}" height="${H-Y(zonas[0])}" fill="#E3F0EA"/><rect x="0" y="${Y(zonas[1])}" width="${W}" height="${Y(zonas[0])-Y(zonas[1])}" fill="#F7ECD9"/><rect x="0" y="0" width="${W}" height="${Y(zonas[1])}" fill="#F5E1DA"/>`;}
  return `<svg viewBox="0 0 ${W} ${H+14}" width="100%" role="img" aria-label="evolución">${bg}<polyline fill="none" stroke="#354F52" stroke-width="2" points="${pts.map(p=>X(p.i)+','+Y(p.v)).join(' ')}"/>${pts.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="3.2" fill="#354F52"/><text x="${X(p.i)}" y="${Y(p.v)-6}" text-anchor="middle" font-size="9" fill="#2F3E46" font-family="Inter">${segFmt(p.v,p.v%1?1:0)}</text>`).join('')}${labels.map((l,i)=>`<text x="${X(i)}" y="${H+11}" text-anchor="middle" font-size="8.5" fill="#9FACA3" font-family="Inter">${l.split(' ')[0]}</text>`).join('')}</svg>`;
}
function pasLectura(r){
  const q={A:'Grande para su edad y todavía no llegó a su pico',B:'Grande porque ya maduró: ventaja física que se va a achicar',C:'Más chico hoy, con el pico de crecimiento por delante',D:'Más chico y ya en su pico'}[r.cuad]||'';
  const g={'Óptimo':'grasa óptima','Aceptable':'grasa aceptable','Exceso':'grasa en exceso'}[r.zona]||'';
  const e={'Mejorando':'y mejorando','Empeoró':'y en aumento','Variable':'y muy variable','Constante y bien':'y estable','Estancado':'sin cambios'}[r.evol]||'';
  const cierre=r.badges.some(b=>b[0]==='estrella')?' Alta proyección física.':r.sem==='Rojo'?' Prioridad nutricional.':r.badges.some(b=>b[0]==='proteger')?' Evaluarlo por técnica: su tamaño es cuestión de tiempo.':'';
  return `${q}${g?`; ${g} ${e}`:''}.${cierre}`;
}
function pasFicha(key){
  const D=pasData; const r=D.rows.find(x=>x.key===key); if(!r) return;
  document.getElementById('pasFicha')?.remove();
  const o=r.o, ex=r.extra||{}, RV=PASAJE.river, c=D.crit;
  const mini=(l,v,s)=>`<div class="pas-mini"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  const posRef=ex.pos&&RV.pos9[String(ex.pos).toUpperCase().slice(0,3)];
  const posTxt=posRef&&o?`<p>${posRef.n} de River 9ª: ${segFmt(posRef.talla[0])} cm y ${segFmt(posRef.peso[0])} kg. ${r.name.split(' ')[0]}: ${pasSigno(o.talla-posRef.talla[0])} cm y ${pasSigno(o.peso-posRef.peso[0])} kg.</p>`:'<p class="muted">Cuando se cargue la posición en la planilla, acá aparece la comparación con River 9ª de su puesto.</p>';
  const pos=r.mo!=null?Math.max(0,Math.min(100,(r.mo+3)/5*100)):null;
  const ov=document.createElement('div'); ov.id='pasFicha'; ov.className='pas-ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Ficha de '+r.name);
  ov.innerHTML=`<div class="pas-modal">
    <button type="button" class="pas-x" aria-label="Cerrar">✕</button>
    <div class="pas-fh"><div><h3>${segEsc(r.name)}</h3><div class="pas-fsub">${r.dob?`Nació el ${segFmtDate(r.dob)} · ${['','ene–mar','abr–jun','jul–sep','oct–dic'][r.tri]}`:'Sin fecha de nacimiento'}${r.edad!=null?` · ${segFmt(r.edad)} años en ${D.L.split(' ')[0].toLowerCase()}`:''}</div></div>
      <div class="pas-fchips">${pasChipSem(r.sem)}${r.cuad?`<span class="pas-qchip" style="--qc:${CUAD[r.cuad].c}">${r.cuad} · ${CUAD[r.cuad].t}</span>`:''}${pasBadges(r)}</div></div>
    ${o?`<p class="pas-lect">${pasLectura(r)}</p>
    <div class="pas-minis">
      ${mini('Talla',`${segFmt(o.talla)} cm`,`${r.pctT!=null?'P'+Math.round(r.pctT)+' para la edad · ':''}${r.vsNov} de River`)}
      ${mini('Peso',`${segFmt(o.peso)} kg`,'')}
      ${mini('IMC',`${segFmt(r.imc)}`,r.estado||'')}
      ${mini('Σ6 pliegues',o.pl!=null?`${segFmt(o.pl,0)} mm`:'—',r.zona||'')}
      ${mini('% grasa estimado',r.grasa!=null?`${segFmt(r.grasa)}%`:'—','Slaughter')}
      ${mini('Masa magra',r.mlg!=null?`${segFmt(r.mlg)} kg`:'—',r.imlg!=null?`IMLG ${segFmt(r.imlg)} kg/m²`:'')}
    </div>
    ${r.mo!=null?`<div class="pas-fsec"><h4>Maduración</h4><p>Pico de crecimiento estimado a los <b>${segFmt(r.phv)} años</b>; hoy está a ${segFmt(Math.abs(r.mo))} años ${r.mo<0?'antes':'después'} del pico (${r.mom.toLowerCase()}). Margen de error ±0,5–1 año.</p>
      <div class="pas-mbar"><span style="flex:2;background:#E1ECF5">Antes del estirón</span><span style="flex:2;background:#F7ECD9">En el estirón</span><span style="flex:1;background:#F5E1DA">Después</span><i style="left:${pos}%"></i></div></div>`:''}
    <div class="pas-fsec"><h4>Evolución en el año</h4><div class="pas-sparks">
      <div><div class="l">Talla (cm)</div>${pasSpark(r.tallas,D.ses)}</div><div><div class="l">Peso (kg)</div>${pasSpark(r.pesos,D.ses)}</div><div><div class="l">Σ6 pliegues (mm)</div>${pasSpark(r.pls,D.ses,c?[c.opt,c.acc]:null)}</div></div>
      <p>Velocidad de crecimiento: ${r.vel!=null?`<b>${segFmt(r.vel)} cm/año</b> (${Math.round(r.meses)} meses de seguimiento; referencia 5–10)`:'—'}. Cambio en el año: peso ${pasSigno(r.dPeso)} kg · masa magra ${pasSigno(r.dMlg)} kg · masa grasa ${pasSigno(r.dMg)} kg · Σ6 ${pasSigno(r.dPl,0)} mm.</p></div>
    <div class="pas-fsec"><h4>Comparación por posición</h4>${posTxt}</div>`:`<p class="muted">No se midió en ${D.L}.</p>`}
    <div class="pas-fsec"><h4>Datos del cuerpo técnico</h4><div class="pas-ct">
      <div><span>Posición</span>${segEsc(ex.pos)||'<i>completar en la planilla</i>'}</div><div><span>Pie hábil</span>${segEsc(ex.pie)||'<i>completar</i>'}</div>
      <div><span>Talla padre / madre</span>${ex.padre||ex.madre?`${ex.padre?segFmt(ex.padre,0):'—'} / ${ex.madre?segFmt(ex.madre,0):'—'} cm`:'<i>completar</i>'}</div>
      <div><span>Tests físicos 2027</span><i>CMJ, sprint 10 y 30 m, Yo-Yo IR1</i></div>
      <div style="grid-column:1/-1"><span>Observaciones</span>${segEsc(ex.obsCT)||'<i>completar en la hoja Jugadores</i>'}</div></div></div>
    <div class="pas-factions"><button type="button" class="guia-btn" onclick="document.getElementById('pasFicha').remove();segCurrent='${segEsc(r.key)}';segCatFilter='${D.catId}';showSeguimiento()">Ver percentiles en Seguimiento</button></div>
  </div>`;
  document.body.appendChild(ov);
  const cerrar=()=>{ov.remove();document.removeEventListener('keydown',esc);};
  const esc=e=>{if(e.key==='Escape') cerrar();};
  document.addEventListener('keydown',esc);
  ov.addEventListener('click',e=>{if(e.target===ov) cerrar();});
  ov.querySelector('.pas-x').addEventListener('click',cerrar); ov.querySelector('.pas-x').focus();
}

// BIENVENIDA (primera visita). Se recuerda en este navegador.
// ═══════════════════════════════════════════
const GUIA_KEY='riestra_bienvenida_v1';
function guiaLeer(){try{return localStorage.getItem(GUIA_KEY);}catch(e){return null;}}
function guiaGuardar(v){try{localStorage.setItem(GUIA_KEY,v);}catch(e){}}
function bienvenidaInicio(){ if(!guiaLeer()) abrirGuia('pregunta'); }
function cerrarGuia(){ document.getElementById('guiaOverlay')?.remove(); }
function abrirGuia(paso){
  cerrarGuia();
  const ov=document.createElement('div'); ov.id='guiaOverlay'; ov.className='guia-overlay';
  ov.innerHTML = paso==='pregunta' ? `
    <div class="guia-card" role="dialog" aria-modal="true" aria-labelledby="guiaT">
      <div class="guia-eyebrow">Bienvenido</div>
      <h3 id="guiaT">¿Es la primera vez que entrás al portal?</h3>
      <p class="guia-p">Si querés, te mostramos en un vistazo dónde está cada cosa.</p>
      <div class="guia-actions">
        <button type="button" class="guia-btn primary" onclick="abrirGuia('guia')">Sí, mostrame</button>
        <button type="button" class="guia-btn" onclick="guiaGuardar('omitida');cerrarGuia()">No</button>
      </div>
    </div>` : `
    <div class="guia-card" role="dialog" aria-modal="true" aria-labelledby="guiaT">
      <div class="guia-eyebrow">Un vistazo rápido</div>
      <h3 id="guiaT">Qué vas a encontrar</h3>
      <dl class="guia-list">
        <div><dt>Inicio</dt><dd>El resumen del plantel, siempre al día.</dd></div>
        <div><dt>Seguimiento</dt><dd>Buscá un jugador y mirá su peso y talla sobre las curvas de percentilos, o revisá la categoría entera.</dd></div>
        <div><dt>Informe final</dt><dd>Cómo cambió el estado nutricional de cada categoría a lo largo del año, listo para imprimir.</dd></div>
        <div><dt>Categorías</dt><dd>Arriba, los informes y planillas. Abajo, los gráficos del grupo.</dd></div>
      </dl>
      <div class="guia-colors">${['dentro','vigilar','encima','debajo'].map(k=>`<span><i style="background:${ZONA[k].color}"></i>${ZONA[k].label}</span>`).join('')}</div>
      <div class="guia-actions"><button type="button" class="guia-btn primary" onclick="guiaGuardar('vista');cerrarGuia()">Entendido</button></div>
      <div class="guia-foot">Podés volver a verlo con el botón “Guía”, arriba a la derecha.</div>
    </div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov){ guiaGuardar(guiaLeer()||'omitida'); cerrarGuia(); } });
  document.body.appendChild(ov);
  ov.querySelector('.guia-btn')?.focus();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('guiaOverlay')){ guiaGuardar(guiaLeer()||'omitida'); cerrarGuia(); } });
